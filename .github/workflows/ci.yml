name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv build

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --group dev
      - run: uv run pytest

  # MCP has no extra: the instrumentation ships in the SDK and activates when
  # the user's own `mcp` package is importable, so any major they install is
  # in scope. The two majors have different result shapes (snake_case +
  # InputRequiredResult in 2.x, GLA2-300); the default suite exercises the
  # dev group's 1.x, and this job re-runs the MCP instrumentation tests with
  # 2.x overlaid so a future rename fails a build instead of silently
  # un-flagging error results.
  mcp-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run --with "mcp>=2,<3" pytest tests/test_mcp_instrumentation.py

  # Every instrumentation.REGISTRY entry must resolve against its real package —
  # enable_instrumentations() swallows ImportError, so a typo'd module/class name
  # would otherwise ship silently.
  extras-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --all-extras
      - run: uv run pytest tests/test_instrumentation_registry.py
        env:
          GLASSFLOW_ALL_EXTRAS: "1"
