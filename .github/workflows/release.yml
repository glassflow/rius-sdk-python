name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/glassflow-rius/
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: uv run pytest
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  # Tell glassflow-docs a new version shipped: its bump-api-reference workflow
  # opens the pin-bump + regenerated-reference PR. Fires only after the PyPI
  # publish succeeded (the docs workflow pip-installs the version). Needs
  # DOCS_DISPATCH_TOKEN — a fine-grained PAT (or GitHub App token) with
  # contents:write on glassflow/glassflow-docs; GITHUB_TOKEN cannot dispatch
  # cross-repo. Skips gracefully while the secret is unset (the docs
  # workflow's weekly schedule is the fallback).
  dispatch-docs:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch the docs API-reference bump
        env:
          TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "DOCS_DISPATCH_TOKEN not configured; skipping (the docs weekly fallback will catch up)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version="${TAG#v}"
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/glassflow/glassflow-docs/dispatches \
            -d "{\"event_type\":\"sdk-release\",\"client_payload\":{\"version\":\"$version\"}}"

  # Announce on Slack AFTER the PyPI publish succeeds, so the channel only
  # ever sees releases that actually shipped. A separate `on: release`
  # workflow would never fire: release-please creates the GitHub Release with
  # GITHUB_TOKEN, whose events don't trigger other workflows.
  notify:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Post release summary to Slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_RELEASES }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "SLACK_WEBHOOK_RELEASES not configured; skipping." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          release_json=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body,url)
          url=$(jq -r .url <<<"$release_json")
          # release-please changelog markdown -> Slack mrkdwn:
          # headings to bold, **bold** to *bold*, [text](url) to <url|text>
          body=$(jq -r .body <<<"$release_json" | sed -E \
            -e 's/^#{1,6} +(.*)$/*\1*/' \
            -e 's/\*\*([^*]+)\*\*/*\1*/g' \
            -e 's/\[([^]]+)\]\(([^)]+)\)/<\2|\1>/g' \
            | head -c 3500)
          jq -n --arg tag "$TAG" --arg url "$url" --arg body "$body" \
            '{text: (":package: *glassflow-rius \($tag)* is on PyPI (<\($url)|release notes>)\n\n\($body)")}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK"

  # Record this version in Linear Releases (the "Python SDK" pipeline). The
  # sync scans commits since the pipeline's previously recorded release and
  # sends the squash-merge PR numbers to Linear, which resolves them to the
  # issues those PRs are linked to — attribution rides the existing
  # branch-name links, so commit subjects need no ticket refs. Runs only
  # after the PyPI publish succeeded: a release in Linear means "installable
  # from the registry", the same contract as the Slack announcement. Needs
  # LINEAR_ACCESS_KEY — the pipeline access key generated in Linear under
  # Settings → Releases (a personal API key does not work). Skips gracefully
  # while the secret is unset.
  linear-release:
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check for a pipeline access key
        id: key
        env:
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "$LINEAR_ACCESS_KEY" ]; then
            echo "LINEAR_ACCESS_KEY not configured; skipping the Linear release sync." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT" # PyPI URLs carry no v prefix
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.key.outputs.present == 'true' }}
        with:
          fetch-depth: 0 # the sync scans history back to the last recorded release
      - uses: linear/linear-release-action@53ad0f863963e7f8e270fba18426bbb55ef55384 # v0.17.2
        if: ${{ steps.key.outputs.present == 'true' }}
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: ${{ needs.release-please.outputs.tag_name }}
          version: ${{ needs.release-please.outputs.tag_name }}
          links: |
            PyPI=https://pypi.org/project/glassflow-rius/${{ steps.key.outputs.version }}/
