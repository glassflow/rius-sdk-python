# Runs the LangChain, LiteLLM and LlamaIndex span-context stopgaps against the
# newest released instrumentors and the libraries they hook, resolved now
# rather than from uv.lock.
#
# The stopgaps rely on details of an OpenInference instrumentor, so they
# install only on the instrumentor versions those details were checked
# against (VERIFIED_VERSIONS in rius/langchain_span_context.py,
# rius/litellm_stream_context.py and rius/llama_index_span_context.py). The
# extras have no upper bound, so a user who upgrades past that range silently
# goes back to counting usage twice.
# The lock never moves on its own, so the main test job cannot see that day
# coming: this job can. When it fails on a new release, re-read the
# instrumentor's internals, widen VERIFIED_VERSIONS, and bump the lock.
#
# The stopgaps also depend on the libraries the instrumentors trace: the
# LangChain one wraps private langchain-core methods, the LiteLLM one runs
# litellm's streaming functions through the instrumentor's wrappers, and the
# LlamaIndex one adds a span handler to LlamaIndex's dispatcher
# (llama-index-instrumentation) and wraps the stream methods of its LLM classes
# (llama-index-core, llama-index-llms-openai). Those are the user's own
# dependencies and move quickly. A reshape there is just as silent (install
# returns False, or the call runs un-nested), so they move here too.
#
# The Anthropic instrumentor and the anthropic library move here as well. They
# have no stopgap, but OpenInference 3.x raised its floor to anthropic>=1.8.0
# and changed what a streamed messages.create() records, which the lock hid
# until Dependabot bumped it. The anthropic tests in test_instrumentation.py,
# test_normalization_response_id.py, test_normalization_error_type.py (a
# provider error's error.type) and test_normalization_compaction.py (the
# compaction flag on an instrumented call) run against the newest pair so the
# next such change shows up here first, as does test_anthropic_native_span.py:
# from 1.14.0 the anthropic SDK starts a chat span of its own, which rius
# demotes to a plain client span while OpenInference instruments the call, and
# a new release may rename its scope or its attributes.
#
# The tests answer every request in-process and guard the socket, so the only
# network use is the package index.
name: upstream-stopgaps

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-stopgaps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  newest-instrumentors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # Re-resolve only the instrumentors and the libraries they hook
      # (and whatever those newly need), so the rest of the environment stays
      # as locked.
      - name: Upgrade the instrumentors and hooked libraries past the lock
        run: |
          uv lock \
            --upgrade-package openinference-instrumentation-anthropic \
            --upgrade-package anthropic \
            --upgrade-package openinference-instrumentation-langchain \
            --upgrade-package openinference-instrumentation-litellm \
            --upgrade-package openinference-instrumentation-llama-index \
            --upgrade-package langchain-core \
            --upgrade-package langchain-openai \
            --upgrade-package litellm \
            --upgrade-package llama-index-core \
            --upgrade-package llama-index-instrumentation \
            --upgrade-package llama-index-llms-openai
          uv sync --group dev
          uv pip show \
            openinference-instrumentation-anthropic anthropic \
            openinference-instrumentation-langchain openinference-instrumentation-litellm \
            openinference-instrumentation-llama-index \
            langchain-core langchain-openai litellm \
            llama-index-core llama-index-instrumentation llama-index-llms-openai \
            | grep -E '^(Name|Version):'
      - run: >-
          uv run --no-sync pytest
          tests/test_langchain_span_context.py
          tests/test_litellm_stream_context.py
          tests/test_llama_index_span_context.py
      - run: >-
          uv run --no-sync pytest -k anthropic
          tests/test_instrumentation.py
          tests/test_normalization_response_id.py
          tests/test_normalization_error_type.py
          tests/test_normalization_compaction.py
          tests/test_anthropic_native_span.py
