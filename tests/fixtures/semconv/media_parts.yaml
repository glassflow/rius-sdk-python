# Media parts: what every producer's image, audio and file content becomes
# after normalization, and which recordings prove it.
#
# After normalization a media part is exactly one of these (see the part
# shapes below), and inline bytes never survive: a blob is always stripped.
#
#   blob  {"type":"blob","modality","mime_type"?,"byte_size"?,"stripped_reason"}
#         Inline bytes, with no `content`. byte_size is the decoded length,
#         omitted when it is unknown.
#   uri   {"type":"uri","modality","mime_type"?,"uri"}
#         Referenced by URL, of any scheme (http, https, gs, s3, file and
#         others). A data: URL is never a uri: it becomes a blob.
#   file  {"type":"file","modality","mime_type"?,"file_id"}
#         A provider file id.
#
# Their members are written in the order shown, and a member whose value is
# unknown is omitted, never null: see part_shapes.
#
# Every normalized media part carries a modality. The rule that picks it is in
# part_shapes (rules).
#
# A part whose type no normalizer recognizes passes through unchanged as a
# generic part. It is never wrapped in a text part.
#
# One row per source shape. tests/test_media_parts.py and the registry linter
# check the file's rules; tools/check_fixtures.py checks that every fixtures
# id names a recorded scenario. The generated table is
# out/docs/media-parts.md.
#
# Fields
#
#   modalities        The modality vocabulary (the upstream enum).
#   stripped_reasons  The `stripped_reason` vocabulary on a blob, with what
#                     each means. A Rius vocabulary on a free-form upstream
#                     field: exactly not_captured and redacted_upstream.
#   part_shapes       The serialized member order and omission rules of a
#                     normalized part, the filename extension to modality
#                     map, and examples: of a part (examples), of a part
#                     rebuilt in place (in_place_examples), and of a source
#                     message that makes a part or none (message_examples):
#                     its source attribute, and any attributes the span
#                     carries beside it.
#   raw_payloads      Where parts come from (message keys only), and how a
#                     raw request or response payload is stripped of media in
#                     place. Its detection rules are the ones
#                     tools/check_fixtures.py applies to expected results. Its
#                     byte_objects say how an SDK writes a byte object into a
#                     value it serializes.
#   source     producer.api: who writes the shape, and through which API.
#   shape      The source shape, as the producer writes it.
#   direction  input | output. Whether the shape is in a request message or
#              in a response message.
#   normalized What the part becomes: blob, uri, file, text (it is text to
#              the model, so it becomes text parts) or generic (no rule maps
#              it, so it stays as it came). A list when
#              the shape normalizes to more than one of these, depending on
#              its value. none (on its own) when no part is made: the media
#              is only in a raw payload, or the instrumentor dropped it, and
#              any raw payload holding it is stripped per raw_payloads.
#   modality   image, video, audio or document, or from_mime: the modality
#              rule in part_shapes.rules (the MIME type, then the item kind,
#              the filename or the URI path's extension, then document).
#              Not needed when normalized is text, generic or none.
#   paths      Which paths deliver the shape today: passthrough (the SDK
#              helpers, set_input / setInput with raw provider dicts),
#              openinference (flattened message contents), openllmetry,
#              laminar (provider blocks), vercel (ai.prompt.messages),
#              native (semconv parts). openinference is named only where an
#              OpenInference fixture proves the row.
#   fixtures   Scenario ids, <family>/<scenario>: a directory under
#              fixtures/ and a key of recordings.<file>.scenarios in that
#              family's manifest.json. Each must exist.
#   reason     Why no fixture proves the row yet. Required when fixtures is
#              empty.
#   raw_payload  On a none row that describes a raw payload: the attribute
#              key (or a list of keys) holding it, each one of
#              raw_payloads.raw_keys. The payload is stripped per
#              raw_payloads and makes no part, so its fixtures may also be
#              cited by a row for the part the same scenario's message keys
#              make. Not used on a none row whose message source makes
#              nothing (the instrumentor dropped the media).
#   note       Optional detail on how the shape normalizes.

modalities: [image, video, audio, document]

stripped_reasons:
  not_captured: Our default policy removed the inline bytes.
  redacted_upstream: The instrumentor dropped or replaced the payload before we saw it (OpenInference __REDACTED__, a data URL with no bytes, an image with no url).

raw_payloads:
  source_rule: >-
    Normalized message parts come only from message keys: gen_ai.input.messages,
    gen_ai.output.messages and gen_ai.system_instructions, or the flattened
    instrumentor message keys each normalizer already maps (OpenInference
    llm.input_messages.* and llm.output_messages.*, OpenLLMetry gen_ai.prompt.*
    and gen_ai.completion.*, Vercel ai.prompt.messages). Raw request and response
    payloads are never mined to rebuild parts.
  # Exact keys, or prefixes ending in a dot.
  message_keys:
    - gen_ai.input.messages
    - gen_ai.output.messages
    - gen_ai.system_instructions
    - llm.input_messages.
    - llm.output_messages.
    - gen_ai.prompt.
    - gen_ai.completion.
    - ai.prompt.messages
  # Span attributes, and the sink's stored columns, that hold a raw payload.
  raw_keys:
    - input.value
    - output.value
    - lmnr.span.input
    - lmnr.span.output
    - ai.prompt
    - pydantic_ai.all_messages
    - InputValue
    - OutputValue
  strip_rule: >-
    Each media token (found by the detection rules below) is replaced in place.
    Every other byte of the string stays identical: normalizers must not parse and
    re-serialize the JSON. Byte equality across the Python SDK, the TypeScript SDK
    and the Go sink depends on this. Message parts in gen_ai.*.messages keep the
    stripped blob part shape instead; the replacement string is only for raw
    payloads.
  scope: >-
    The SDKs strip every string value, and every element of a string-array
    value, of the span attributes, the span event attributes and the span link
    attributes. They do not strip resource or scope attributes: a span processor
    cannot rewrite them. The sink applies the same rules to its stored columns
    InputValue, OutputValue, InputMessages and OutputMessages and to the values
    of SpanAttributes. tools/check_fixtures.py scans more than the strip covers:
    it also scans the resource and scope attributes of a recording. That scan is
    a check, not a strip rule, and media in those attributes would still be a
    bug. An SDK may bound the work it spends on one very large value. Past that
    bound no media survives, but byte identity with the other implementations
    is not promised.
  order: >-
    A normalizer first builds parts from the message keys (the source rule).
    Stripping runs last, over every string attribute in scope, including the
    message-key attributes it keeps and the gen_ai.*.messages it produced. A
    stripped blob part carries no content, so nothing in it matches; a text part
    holding a data URL gets rule (b) in place. So in a message key (and in the
    sink's InputMessages and OutputMessages columns) a blob part never has a
    content member, while in any other attribute or column a blob part's content
    may be a complete replacement, the one rule (e) writes there. The fixture
    check holds expected results to exactly this: a normalized blob part
    carries no content. Within one pass, every rule reads the text as it was before the pass: rule
    (e) takes its context and its mime type from each object's member values as
    they were, never from a sibling the same pass has already rewritten (see
    members). A walker that rewrites the document in place must keep reading the
    original values.
  json_candidate: >-
    A string value is a JSON candidate when, after trimming leading space, tab,
    newline and carriage return (ASCII only: U+00A0 and other Unicode spaces are
    not trimmed), it starts with `{` or `[`. A candidate parses when the whole
    string is one RFC 8259 JSON value, with only those four whitespace
    characters around it (no NaN, Infinity, comments or trailing commas;
    duplicate keys are allowed, and every one is read, see members), nested at
    most 64 levels deep. Arrays and objects count together, from the candidate's
    root: the root array or object is level 1, and a candidate nested deeper
    than 64 levels does not parse. A JSON document in a string inside JSON
    continues the same count: its root is one level below the deepest array or
    object holding that string, so a nested document that goes past 64 does not
    parse (rule (b) only, for it), while the document around it still does. The
    limit is explicit: an implementation counts the depth itself and never
    relies on its parser's or its language's recursion limit, so no input makes
    the strip fail. When it parses, rules (d), (e) and (b) apply to the values
    inside it; a string value inside it that is itself a JSON candidate is
    processed by the same rules, recursively, at its escaped location, its own
    document starting with no parent key and no enclosing object: nothing
    outside it is context for rule (e), and rule (d) inside it takes no mime
    type from outside. When it does not parse (a truncated payload, say), only
    rule (b) applies, to the string as it is (for a string inside JSON, to its
    unescaped value). A string that is not a candidate gets rule (b) only.
    Object keys are never matched.
  precedence: >-
    Values are visited in document order. At each value rule (d) is tried, then
    (e), then (b), and the first that matches wins. A value inside a replaced
    token is never visited: once (e) replaces a string, (b) does not look inside
    it, and nothing inside a replaced Buffer object is looked at. An array element
    inherits the parent key of its array, so `{"audio":[{"data":"..."}]}` matches
    (e) through the parent key audio; in the same way, the enclosing object rule
    (d) takes its mime type from is the nearest object holding the Buffer,
    directly or through arrays, and so is the holder whose mime type a typed key
    with holder_mime reads. A typed key with keeps_urls leaves a string that
    starts with a URL scheme to (b) only when its scheme is not data, or when
    (b)'s pattern matches the whole unescaped string: such a string is no (e)
    token, so (b) is tried on it, and a base64 data URL that is the whole value
    is replaced with its own mime type and size, while any other URL stays. Any
    other string that starts with data: under that key (a run wrapped at a
    newline, a percent-encoded payload, a run (b) stops short in) is an (e)
    token, replaced whole with the key's usual mime type (see rule (e)).
  idempotence: >-
    Every implementation follows this rule: a string that is already a complete
    replacement, `[stripped <mime> <byte_size> bytes]` whose mime is unknown or
    matches mime_pattern in full (exactly the mimes a replacement can hold) and
    whose byte_size is ASCII digits or unknown, is never stripped again, by rule
    (e) or rule (b). Nor is a complete replacement ever context for rule (e): as
    the value of a sibling (a mime key, format or output_format) it counts
    neither for whether rule (e) fires nor for the mime type it chooses. So a
    Buffer that rule (d) turned into a replacement in one pass (`{"mediaType":
    {"type":"Buffer","data":[1]},"data":"QUFB"}`) makes no token of its siblings
    in the next. With both, strip(strip(x)) is strip(x) for every x except one
    class: a JSON candidate that does not parse before pass 1 and does parse
    after it. Elsewhere the sink re-strips what an SDK already stripped and gets
    the same bytes. In that class a second pass may strip more. It needs
    malformed JSON whose only defect sits inside a rule (b) data URL (an invalid
    escape such as `\d` in a mime type): pass 1 can only apply rule (b), which
    removes the defect, and pass 2 then parses the candidate and rules (d) and
    (e) fire on what pass 1 left, a partial replacement for instance. No media
    survives in either pass, and only the replacement text differs. See
    `a_second_pass_after_the_candidate_starts_to_parse`. A string
    that only looks like one is still a token: `[stripped image/png lots
    bytes]`, or `[stripped a b 3 bytes]` (rule e), or `[stripped
    data:image/png;base64,... 1 bytes]`, whose data URL rule (b) replaces.
  spans: >-
    Every span is on the original text; nothing is re-serialized. (d) The object
    token, from its `{` to its matching `}`, is replaced by the replacement as a
    JSON string literal, quotes included. (e) The string literal, quotes
    included, is replaced by the replacement as a JSON string literal, quotes
    included. (b) In a JSON string, only the URL's characters are replaced: the
    replacement goes inside the existing quotes, with no quotes added. (b) In a
    string that is not JSON (or did not parse), the URL's characters are replaced
    by the replacement, with no quotes. Rules (b) and (e) read a JSON string's
    unescaped value, so a span starts at the first raw character of its first
    character and ends after the last raw character of its last, escapes
    included (`data:image\/png` is read as `data:image/png`). Text written into a
    JSON string is escaped for its level with the minimal escapes JSON.stringify
    writes, and no others: `\"` for a quote, `\\` for a backslash, `\b` `\f`
    `\n` `\r` `\t`, `\u00xx` (lowercase hex) for any other control character,
    `\udxxx` for a lone surrogate. In a JSON string nested in a JSON string, the
    inner replacement is escaped once per level, and every byte outside the
    replaced tokens is kept as it was, including escapes the re-encoder would not
    write (`\u0022`, `\/`).
  byte_size: >-
    Rule (e) computes it on the string's unescaped value, and rule (b) on its
    base64 run, the same way. Remove space, tab, newline and carriage return.
    When what is left is not valid base64, byte_size is unknown. Valid means:
    every character before the padding is from one alphabet, `A-Z a-z 0-9 + /` or
    `A-Z a-z 0-9 - _` (never `+` or `/` together with `-` or `_`); the padding is
    at most two `=`, only at the end; and the length, padding counted, is a
    multiple of 4 (so unpadded base64 is not valid). For valid base64, byte_size
    is length times 3 / 4, minus the number of `=`. Rule (d) takes the length of
    its data array.
  members: >-
    Every member of an object is visited, in document order, duplicate keys
    included. A condition on a key holds when any member with that key meets it
    (a type equal to Buffer, blob or base64 or to one of a typed key's types, a
    non-empty data array, a sibling), and a value read from a key (a mime type,
    a format, a Buffer's data array) is that of the first member with that key,
    in document order, that qualifies. Rule (e) applies to each member under one
    of its keys that qualifies, duplicates included, all with the context and
    mime type computed from all the siblings:
    `{"mediaType":"image/png","data":"QUFB","data":"QkJC"}` strips both data
    values. A sibling counts as context only when its value is a non-empty
    string that is not a complete replacement (see idempotence), the same rule
    as mime selection. Context and mime type are read from the member values as
    they were before the pass, so document order does not matter: in
    `{"mediaType":"data:image/png;base64,QUFB","data":"QkJC"}` mediaType is
    context, though rule (b) rewrites it in the same pass, and data is a token
    whichever comes first; its mime type is unknown, since the original
    mediaType is not a valid mime. `format` is not a sibling key: it counts only
    under the parent key input_audio or audio (which is context already), where
    it names audio/<format>, and elsewhere a format sibling is ignored;
    output_format counts anywhere. The mime type is chosen by the order of the
    mime key list, not by document order: the first mime key in list order whose
    value is a non-empty valid mime (see replacement) wins; else the first mime
    format, in order, whose sibling is a non-empty string, not a complete
    replacement, and whose mime is valid; else unknown. When a rule (e) key
    holds an array directly, each string element is its own token (when it is
    non-empty and not already a complete replacement), with the same context and
    mime type; any other element is visited as usual, with that key as its
    parent key.
  regex_dialect: >-
    The pattern of rule (b), rule (e)'s url_scheme and the replacement's
    mime_pattern use only constructs Python re, JavaScript RegExp and Go RE2 read the same way:
    literal characters, character classes with explicit ASCII members and
    ranges, the escapes `\t` `\n` `\f` `\r`, capturing groups, and the
    quantifiers `*`, `+` and `{m,n}`. No `\s`, `\d`, `\w`, `\b`, lookaround,
    backreference, non-capturing group or inline flag: the case-insensitive
    scheme is written `[dD][aA][tT][aA]:`, and the repeated RFC 2397 parameter
    is a capturing group. Neither the mime class nor the parameter class holds
    `;` or `:`. RFC 2045 lists `:` as a tspecial, so it cannot appear in an
    unquoted mime type or parameter token, and excluding it keeps the search
    linear: an attempt starts only at a `data:` and never reads past the next
    `:` (the one in the next `data:`), so no stretch of text is read by more
    than two attempts, and inside an attempt the text splits into mime and
    parameters in exactly one way, so backtracking gives back each character at
    most once. Rule (b) finds matches left to right without overlap (Python
    finditer, JavaScript matchAll, Go FindAllStringSubmatchIndex). mime_pattern
    must match the whole value: Python re.fullmatch, or `^` and `$` around it in
    JavaScript and Go (where, without the m flag, `$` is the end of the text; in
    Python `$` also matches before a final newline, so use fullmatch).
    url_scheme must match at the start of the unescaped value and need not reach
    its end: Python re.match, or `^` before it in JavaScript and Go. The scheme
    a keeps_urls key compares with data is the text before the first colon,
    which url_scheme makes ASCII. For that key, rule (b)'s pattern must match
    the whole unescaped value: Python re.fullmatch, or `^` and `$` around it in
    JavaScript and Go, as for mime_pattern.
  implementers: >-
    Do not write the replacement, or any escape, with a
    standard library JSON encoder: Go's json.Marshal, for example, writes `<`,
    `>`, `&` and U+2028 as `\u003c`, `\u003e`, `\u0026` and `\u2028`, which no
    other implementation writes. Do not compute byte_size with a strict standard
    library base64 decoder either: decoders differ on whitespace, URL-safe input
    and padding. The escaping rules (spans), the size rules (byte_size) and the
    mime rule (replacement) here are exhaustive: write exactly what they say, and
    keep every other byte as it was. Read JSON with a parser that keeps the span
    of every value on the text and every duplicate member (members), and that
    counts the depth itself (json_candidate).
  reference: >-
    generators/media_parts.py strip_raw_payload(raw, text) is the reference
    implementation: the one function a normalizer author reproduces. It returns
    the stripped string; strip(raw, text) also returns the tokens it replaced
    (rule, mime, byte_size), in document order. The golden examples below are its
    tests, and every normalizer's.
  replacement:
    # Rules (d) and (e) write it as a JSON string literal, quotes included;
    # rule (b) writes the bare text, inside the quotes already there in a JSON
    # string (see spans).
    format: '[stripped <mime> <byte_size> bytes]'
    unknown: unknown
    # The mime type, by token: a data URL's own media type (unknown when
    # empty); for rule (e), a sibling mime key, else image/<output_format>, else
    # audio/<format> when the parent key is input_audio or audio, else, for a
    # typed key with holder_mime, a mime key of the enclosing object; for rule
    # (d), a mime key of the enclosing object. Mime keys are tried in the order of
    # the rule's mime_keys list, and a mime key counts only when its value is a
    # valid mime; a format counts only when its value is a non-empty string and
    # the mime it gives is valid (see members). Valid means the whole mime
    # matches mime_pattern: a token/token MIME type. Anything else is unknown,
    # whatever rule found the token, so text from a sibling (a data URL, a
    # quote) never reaches a replacement.
    mime_pattern: '[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+'
    examples:
      - '[stripped image/png 67 bytes]'
      - '[stripped unknown unknown bytes]'
    # A data URL inside prose: only the token is replaced.
    in_text:
      before: 'see data:image/png;base64,iVBORw0KGgo= here'
      after: 'see [stripped image/png 8 bytes] here'
    tokens:
      - token: A data URL (rule b), anywhere in a string
        replaced: 'The URL characters alone, from data: (in any case) to the end of the base64 run, parameters included, with no quotes added. The text around it stays byte-identical; a string that is only the data URL becomes the replacement text.'
        mime: The URL's media type when it is token/token; unknown when it names none, or anything else.
        byte_size: The base64 run's size, per byte_size; unknown when the run is not valid base64.
      - token: A base64 string value (rule e)
        replaced: The string literal, quotes included, by the replacement as a JSON string literal; for an array under the key, each string element the same way.
        mime: The first of media_type, mediaType, mime_type, mimeType, in that order, that holds a token/token mime; else image/<output_format>; else audio/<format> under input_audio or audio; else, under a typed key with holder_mime (a Vercel v7 tagged data), the enclosing object's first such mime key; else unknown.
        byte_size: The unescaped value's size, per byte_size; unknown when it is not valid base64.
      - token: A Buffer object (rule d)
        replaced: The whole object token, from { to its matching }, by the replacement as a JSON string literal.
        mime: The first of the enclosing object's media_type, mediaType, mime_type, mimeType, in that order, that holds a token/token mime; else unknown.
        byte_size: The length of the data array.
  detection:
    - id: b
      name: data URL
      description: 'A data:<mime>[;<parameter>]*;base64,<base64> token anywhere in a string, the scheme in any case (DATA:, Data:) and RFC 2397 parameters allowed before ;base64, (data:image/png;name=a.png;base64,...). The pattern finds each one: group 1 the mime type (empty when none), group 2 the last parameter (unused), group 3 the base64 run (standard or URL-safe). A whole-string data URL is the special case.'
      pattern: '[dD][aA][tT][aA]:([^;,:\t\n\f\r "]*)(;[^;,:\t\n\f\r "]*)*;base64,([A-Za-z0-9+/_-]*={0,2})'
    - id: d
      name: Buffer object
      description: 'An object {"type": "Buffer", "data": [...]} whose data is a non-empty array.'
      type: Buffer
      array_key: data
      mime_keys: [media_type, mediaType, mime_type, mimeType]
    - id: e
      name: keyed base64 string
      description: 'A non-empty string (or each string of an array) under one of the keys, when its object has one of the sibling keys with a non-empty string value that is not a complete replacement, or its object''s parent key is one of the parent keys, or its object is the value of a source key and has type base64 (the Anthropic {"source":{"type":"base64","media_type":...,"data":...}}: the object holding data is the source itself, not the content block around it); a non-empty string under content when its object has type blob (the semconv blob part, as in a raw payload like pydantic_ai.all_messages: the raw-payload twin of the fixture check''s rule that a normalized blob part carries no content); a non-empty string under a typed key when its object has one of that key''s types and, for a typed key that names parent keys, its object''s parent key is one of them (a LangChain v1 standard content block {"type":"image","base64":...,"mime_type":...}, Mistral''s audio chunk {"type":"input_audio","input_audio":...}, which its TypeScript SDK spells inputAudio, a Vercel image part {"type":"image","image":...}, or the v7 tagged data {"type":"data","data":...} a Vercel file part''s data or image part''s image holds); a non-empty string under one of the source bytes keys when its object is the value of a source key, whatever its type (the Bedrock Converse {"image":{"format":"png","source":{"bytes":...}}}: as for Anthropic, the object holding bytes is the source); and a non-empty string under one of a base64 marker''s own keys when its object has the marker (a member with exactly the marker''s key and string value, as in the LangChain v0 block {"type":"image","source_type":"base64","data":...}, whose marker reaches data and no other key). A typed key with holder_types counts only when the nearest object holding its object, through arrays, has one of those types: the v7 tagged data counts in a Vercel file or image part, never in a {"data":{"type":"data",...}} envelope of some other API. A typed key with keeps_urls leaves a string that starts with a URL scheme (url_scheme) to rule (b), whatever other way its key qualifies, when its scheme is not data (compared in ASCII case-insensitively) or rule (b)''s pattern matches the whole string: an http URL under a Vercel image stays, and a base64 data URL that is the whole value is replaced by rule (b) with its own mime type and size. Any other string that starts with data: (a base64 run wrapped at a newline, a percent-encoded data URL, a run rule (b) stops short in) is a rule (e) token like any other, replaced whole with the key''s usual mime type, so no byte of its payload survives. A typed key with holder_mime takes its mime type, when its own object names none, from the mime keys of the nearest object holding it, as rule (d) does, so a tagged data reads its Vercel part''s mediaType. Never a string that is already a complete replacement (see idempotence). See members for duplicate keys, siblings and arrays.'
      keys: [data, b64_json, result, base64]
      # format is not one: it counts only under input_audio or audio (see members).
      sibling_keys: [media_type, mediaType, mime_type, mimeType, output_format]
      parent_keys: [input_audio, audio, inline_data, inlineData]
      source_key: source
      source_type: base64
      blob_type: blob
      blob_key: content
      # A member that names its object's payload base64: context for its own
      # keys in the same object, and for no other key. The member's value must
      # be exactly the string.
      base64_markers:
        - key: source_type
          value: base64
          keys: [data]
      # A typed key holds base64 when its object has one of its types, with no
      # other context needed. With parent_keys, only when its object's parent
      # key is one of them; with holder_types, only when the nearest object
      # holding it (through arrays, as for rule (d)) has one of those types. With keeps_urls, a string that starts with
      # url_scheme is left to rule (b), unless its scheme is data and rule (b)'s
      # pattern does not match all of it. With holder_mime, the mime type falls
      # back to the enclosing object's mime keys.
      typed_keys:
        - key: base64
          types: [image, audio, video, file, text-plain]
        - key: input_audio
          types: [input_audio]
        - key: inputAudio
          types: [input_audio]
        - key: image
          types: [image]
          keeps_urls: true
        - key: data
          types: [data]
          parent_keys: [data, image]
          holder_types: [file, image]
          keeps_urls: true
          holder_mime: true
      # A URL scheme at the start of a value: an ASCII letter, then letters,
      # digits, +, - or ., then a colon. The same test part_shapes uses to
      # tell a URL from bare base64 in one value.
      url_scheme: '[A-Za-z][A-Za-z0-9+.-]*:'

      # Keys that hold base64 in an object under source_key, whatever its type.
      source_bytes_keys: [bytes]
      mime_keys: [media_type, mediaType, mime_type, mimeType]
      # Tried in order, after the mime keys: <value> is the sibling's value, and
      # an entry with parent_keys counts only under one of them.
      mime_formats:
        - key: output_format
          mime: image/<value>
        - key: format
          mime: audio/<value>
          parent_keys: [input_audio, audio]
  # Exact input and output strings, and the tokens replaced in document order.
  # tests/test_media_parts.py and the registry linter run strip(raw, input) on
  # each one.
  golden:
    - name: anthropic_base64_image_pretty_printed
      note: Rule (e) through a base64 source. The pretty-printed spacing survives, so nothing was re-serialized.
      input: |-
        {
          "model": "claude-sonnet-4-5",
          "messages": [
            {
              "role": "user",
              "content": [
                { "type": "image",  "source": { "type": "base64", "media_type": "image/png", "data": "iVBORw0KGgo=" } },
                { "type": "text", "text": "What is in this image?" }
              ]
            }
          ]
        }
      output: |-
        {
          "model": "claude-sonnet-4-5",
          "messages": [
            {
              "role": "user",
              "content": [
                { "type": "image",  "source": { "type": "base64", "media_type": "image/png", "data": "[stripped image/png 8 bytes]" } },
                { "type": "text", "text": "What is in this image?" }
              ]
            }
          ]
        }
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: openai_input_audio_wav
      note: Rule (e) through the parent key input_audio; the mime type is audio/<format>.
      input: '{"messages":[{"role":"user","content":[{"type":"input_audio","input_audio":{"data":"UklGRiQAAABXQVZF","format":"wav"}}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"input_audio","input_audio":{"data":"[stripped audio/wav 12 bytes]","format":"wav"}}]}]}'
      tokens:
        - {rule: e, mime: audio/wav, byte_size: 12}
    - name: vercel_buffer_in_ai_prompt
      note: Rule (d). The whole Buffer object becomes a string literal; the mime type is the enclosing object's mediaType, byte_size the array length.
      input: '{"messages":[{"role":"user","content":[{"type":"text","text":"What is in this image?"},{"type":"file","data":{"type":"Buffer","data":[137,80,78,71]},"mediaType":"image/png"}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"text","text":"What is in this image?"},{"type":"file","data":"[stripped image/png 4 bytes]","mediaType":"image/png"}]}]}'
      tokens:
        - {rule: d, mime: image/png, byte_size: 4}
    - name: data_url_in_prose
      note: Rule (b) in a string that is not JSON. No quotes are added.
      input: 'Describe data:image/png;base64,iVBORw0KGgo= in one line.'
      output: 'Describe [stripped image/png 8 bytes] in one line.'
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
    - name: data_url_in_json_string
      note: Rule (b) inside JSON string values. The replacement goes inside the quotes already there, and the text around the URL stays.
      input: '{"messages":[{"role":"user","content":[{"type":"image_url","image_url":{"url":"data:image/jpeg;base64,/9j/4AAQSkZJRg=="}},{"type":"text","text":"compare with data:image/png;base64,iVBORw0KGgo= please"}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"image_url","image_url":{"url":"[stripped image/jpeg 10 bytes]"}},{"type":"text","text":"compare with [stripped image/png 8 bytes] please"}]}]}'
      tokens:
        - {rule: b, mime: image/jpeg, byte_size: 10}
        - {rule: b, mime: image/png, byte_size: 8}
    - name: keyed_data_url_rule_e_wins
      note: The string under data is also a data URL. Rule (e) is tried first and wins, so the whole literal is replaced; the data URL is not valid base64, so byte_size is unknown.
      input: '{"data":"data:image/png;base64,iVBORw0KGgo=","mediaType":"image/png"}'
      output: '{"data":"[stripped image/png unknown bytes]","mediaType":"image/png"}'
      tokens:
        - {rule: e, mime: image/png, byte_size: unknown}
    - name: truncated_json_rule_b_only
      note: The payload was cut off, so it does not parse. Only rule (b) applies, to the raw text; the base64 source is left alone.
      input: '{"messages":[{"role":"user","content":[{"type":"image","source":{"type":"base64","media_type":"image/png","data":"iVBORw0KGgo="}},{"type":"image_url","image_url":{"url":"data:image/png;base64,iVBORw0KGgo="}}'
      output: '{"messages":[{"role":"user","content":[{"type":"image","source":{"type":"base64","media_type":"image/png","data":"iVBORw0KGgo="}},{"type":"image_url","image_url":{"url":"[stripped image/png 8 bytes]"}}'
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
    - name: json_nested_in_a_json_string
      note: A tool result holds JSON as a string. It is a JSON candidate, so rule (e) applies inside it, and the replacement literal is written escaped for that level.
      input: '{"messages":[{"role":"tool","content":"{\"source\":{\"type\":\"base64\",\"media_type\":\"image/png\",\"data\":\"iVBORw0KGgo=\"}}"}]}'
      output: '{"messages":[{"role":"tool","content":"{\"source\":{\"type\":\"base64\",\"media_type\":\"image/png\",\"data\":\"[stripped image/png 8 bytes]\"}}"}]}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: nested_json_with_escapes_a_reencoder_would_not_write
      note: The outer string escapes its quotes as \u0022 and its slashes as \/. Only the tokens change; the replacement is written with the minimal escapes, and every other byte, \u0022 and \/ included, is kept.
      input: '{"content":"{\u0022image\u0022:{\u0022url\u0022:\u0022data:image\/png;base64,iVBORw0KGgo=\u0022},\u0022source\u0022:{\u0022type\u0022:\u0022base64\u0022,\u0022data\u0022:\u0022iVBORw0KGgo=\u0022}}"}'
      output: '{"content":"{\u0022image\u0022:{\u0022url\u0022:\u0022[stripped image/png 8 bytes]\u0022},\u0022source\u0022:{\u0022type\u0022:\u0022base64\u0022,\u0022data\u0022:\"[stripped unknown 8 bytes]\"}}"}'
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
        - {rule: e, mime: unknown, byte_size: 8}
    - name: invalid_base64_under_keyed_data
      note: Rule (e) still replaces the string; it is not valid base64, so byte_size is unknown.
      input: '{"input_audio":{"data":"not base64!","format":"wav"}}'
      output: '{"input_audio":{"data":"[stripped audio/wav unknown bytes]","format":"wav"}}'
      tokens:
        - {rule: e, mime: audio/wav, byte_size: unknown}
    - name: unicode_space_before_brace_is_not_json
      note: U+00A0 is not trimmed, so the string is not a JSON candidate. Only rule (b) applies; the base64 source stays.
      input: "\u00a0{\"source\":{\"type\":\"base64\",\"media_type\":\"image/png\",\"data\":\"iVBORw0KGgo=\"},\"url\":\"data:image/png;base64,iVBORw0KGgo=\"}"
      output: "\u00a0{\"source\":{\"type\":\"base64\",\"media_type\":\"image/png\",\"data\":\"iVBORw0KGgo=\"},\"url\":\"[stripped image/png 8 bytes]\"}"
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
    - name: gemini_inline_data_camel_case
      note: Rule (e) through the parent key inlineData; the mime type from mimeType.
      input: '{"contents":[{"role":"user","parts":[{"inlineData":{"mimeType":"image/png","data":"iVBORw0KGgo="}}]}]}'
      output: '{"contents":[{"role":"user","parts":[{"inlineData":{"mimeType":"image/png","data":"[stripped image/png 8 bytes]"}}]}]}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: openai_responses_image_generation_result
      note: Rule (e) through the sibling output_format; the mime type is image/<output_format>.
      input: '{"output":[{"type":"image_generation_call","status":"completed","output_format":"png","result":"iVBORw0KGgo="}]}'
      output: '{"output":[{"type":"image_generation_call","status":"completed","output_format":"png","result":"[stripped image/png 8 bytes]"}]}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: a_null_sibling_is_not_context
      note: A sibling counts as context only when its value is a non-empty string (and format is not a sibling key at all), so data is left alone.
      input: '{"data":"hello","format":null}'
      output: '{"data":"hello","format":null}'
      tokens: []
    - name: format_is_ignored_outside_an_audio_parent
      note: A format sibling counts only under input_audio or audio; here it is ignored, so result is left alone.
      input: '{"result":"hello","format":"text"}'
      output: '{"result":"hello","format":"text"}'
      tokens: []
    - name: format_under_input_audio
      note: Under input_audio the parent key is the context, and format names audio/<format>.
      input: '{"input_audio":{"data":"UklGRg==","format":"wav"}}'
      output: '{"input_audio":{"data":"[stripped audio/wav 4 bytes]","format":"wav"}}'
      tokens:
        - {rule: e, mime: audio/wav, byte_size: 4}
    - name: parent_key_through_an_array
      note: An array element inherits its array's parent key, so audio reaches the object inside the list.
      input: '{"audio":[{"data":"UklGRiQAAABXQVZF"}]}'
      output: '{"audio":[{"data":"[stripped unknown 12 bytes]"}]}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 12}
    - name: size_on_the_unescaped_value
      note: The size is computed on the unescaped value with its whitespace removed; unpadded base64 is not valid, so its size is unknown.
      input: '[{"source":{"type":"base64","media_type":"image/png","data":"iVBO\nRw0K\r\nGgo="}},{"source":{"type":"base64","media_type":"image/png","data":"iVBORw0KGgo"}}]'
      output: '[{"source":{"type":"base64","media_type":"image/png","data":"[stripped image/png 8 bytes]"}},{"source":{"type":"base64","media_type":"image/png","data":"[stripped image/png unknown bytes]"}}]'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
        - {rule: e, mime: image/png, byte_size: unknown}
    - name: stripping_twice_changes_nothing
      note: 'Already-stripped text, stripped again: complete replacements are not tokens, so strip(strip(x)) is strip(x) (test_stripping_is_idempotent checks it for every golden output). [stripped image/png lots bytes] is not a complete replacement, so it is a token.'
      input: '{"source":{"type":"base64","media_type":"image/png","data":"[stripped image/png 8 bytes]"},"inline_data":{"data":"[stripped unknown unknown bytes]"},"text":"see [stripped image/png 8 bytes]","audio":{"data":"[stripped image/png lots bytes]"}}'
      output: '{"source":{"type":"base64","media_type":"image/png","data":"[stripped image/png 8 bytes]"},"inline_data":{"data":"[stripped unknown unknown bytes]"},"text":"see [stripped image/png 8 bytes]","audio":{"data":"[stripped unknown unknown bytes]"}}'
      tokens:
        - {rule: e, mime: unknown, byte_size: unknown}
    - name: pydantic_ai_blob_part_in_all_messages
      note: 'A semconv blob part in a raw payload (pydantic_ai.all_messages): rule (e) replaces its content string in place, mime from mime_type. A text part''s content is left alone.'
      input: '[{"role":"user","parts":[{"type":"text","content":"What is in this image?"},{"type":"blob","mime_type":"image/png","modality":"image","content":"iVBORw0KGgo="}]}]'
      output: '[{"role":"user","parts":[{"type":"text","content":"What is in this image?"},{"type":"blob","mime_type":"image/png","modality":"image","content":"[stripped image/png 8 bytes]"}]}]'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: url_safe_data_url
      note: The base64 run may be URL-safe; mixing the two alphabets is not valid base64.
      input: 'a data:image/png;base64,-_-_ and data:image/png;base64,+_+_ b'
      output: 'a [stripped image/png 3 bytes] and [stripped image/png unknown bytes] b'
      tokens:
        - {rule: b, mime: image/png, byte_size: 3}
        - {rule: b, mime: image/png, byte_size: unknown}
    - name: depth_64_parses
      note: 62 arrays, the object and its source object are 64 levels, the limit. It parses, so rule (e) strips data and rule (b) the url inside its JSON string.
      input: '[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[{"source":{"type":"base64","data":"iVBORw0KGgo=","url":"data:image/png;base64,iVBORw0KGgo="}}]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]'
      output: '[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[{"source":{"type":"base64","data":"[stripped unknown 8 bytes]","url":"[stripped image/png 8 bytes]"}}]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]'
      tokens:
        - {rule: e, mime: unknown, byte_size: 8}
        - {rule: b, mime: image/png, byte_size: 8}
    - name: depth_65_is_rule_b_only
      note: One array more is 65 levels, so the candidate does not parse. Only rule (b) applies, to the raw text; data stays.
      input: '[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[{"source":{"type":"base64","data":"iVBORw0KGgo=","url":"data:image/png;base64,iVBORw0KGgo="}}]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]'
      output: '[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[{"source":{"type":"base64","data":"iVBORw0KGgo=","url":"[stripped image/png 8 bytes]"}}]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]'
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
    - name: duplicate_keys_strip_every_member
      note: Every member is visited in document order; both data members qualify, with the context and mime type of all the siblings.
      input: '{"mediaType":"image/png","data":"QUFB","data":"QkJC"}'
      output: '{"mediaType":"image/png","data":"[stripped image/png 3 bytes]","data":"[stripped image/png 3 bytes]"}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 3}
        - {rule: e, mime: image/png, byte_size: 3}
    - name: mime_key_list_order_wins
      note: mime_type comes first in the document, but media_type comes first in the mime key list, so its value is the mime type.
      input: '{"mime_type":"image/jpeg","media_type":"image/png","data":"QUFB"}'
      output: '{"mime_type":"image/jpeg","media_type":"image/png","data":"[stripped image/png 3 bytes]"}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 3}
    - name: string_array_under_a_keyed_key
      note: An array held directly under data; each string element is its own token, with the same context.
      input: '{"mediaType":"image/png","data":["QUFB"]}'
      output: '{"mediaType":"image/png","data":["[stripped image/png 3 bytes]"]}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 3}
    - name: uppercase_data_url_scheme
      note: The data scheme is case-insensitive.
      input: 'see DATA:image/png;base64,iVBORw0KGgo= here'
      output: 'see [stripped image/png 8 bytes] here'
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
    - name: data_url_with_parameters
      note: RFC 2397 parameters may sit between the mime type and ;base64, and are replaced with the URL.
      input: '{"url":"data:image/png;name=a.png;base64,iVBORw0KGgo="}'
      output: '{"url":"[stripped image/png 8 bytes]"}'
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
    - name: a_replacement_holding_a_data_url_is_not_complete
      note: Its mime is not unknown and not token/token, so the string is not a complete replacement and rule (b) replaces the data URL inside it. A second pass finds nothing (test_stripping_is_idempotent).
      input: '[stripped data:image/png;base64,iVBORw0KGgo= 1 bytes]'
      output: '[stripped [stripped image/png 8 bytes] 1 bytes]'
      tokens:
        - {rule: b, mime: image/png, byte_size: 8}
    - name: a_replacement_with_a_mime_that_is_not_a_token_is_a_token
      note: '[stripped a b 3 bytes] only looks like a replacement (its mime a b is not token/token), so rule (e) replaces it; it is not valid base64, so byte_size is unknown.'
      input: '{"mediaType":"image/png","data":"[stripped a b 3 bytes]"}'
      output: '{"mediaType":"image/png","data":"[stripped image/png unknown bytes]"}'
      tokens:
        - {rule: e, mime: image/png, byte_size: unknown}
    - name: a_nested_document_has_no_enclosing_object
      note: The Buffer is the root of the document nested in x, so it has no enclosing object and the outer mediaType is not its mime type. The replacement literal is written escaped for the string it sits in.
      input: '{"mediaType":"image/png","x":"{\"type\":\"Buffer\",\"data\":[1,2]}"}'
      output: '{"mediaType":"image/png","x":"\"[stripped unknown 2 bytes]\""}'
      tokens:
        - {rule: d, mime: unknown, byte_size: 2}
    - name: a_replaced_buffer_is_not_context
      note: 'Rule (d) replaces the Buffer under mediaType, and a complete replacement is never context, so data is no token: this output is final, and a second pass changes nothing. (tools/check_fixtures.py still flags {"mediaType":{"type":"Buffer",...}} before the strip.)'
      input: '{"mediaType":{"type":"Buffer","data":[1]},"data":"QUFB"}'
      output: '{"mediaType":"[stripped unknown 1 bytes]","data":"QUFB"}'
      tokens:
        - {rule: d, mime: unknown, byte_size: 1}
    - name: a_replaced_buffer_next_to_a_replacement_lookalike
      note: The Buffer gives no context, so data is no rule (e) token; it is not a complete replacement either (its mime is a data URL), so rule (b) replaces the data URL inside it. The output is stable on a second pass.
      input: '{"mediaType":{"type":"Buffer","data":[1]},"data":"[stripped data:image/png;base64,QUFB 1 bytes]"}'
      output: '{"mediaType":"[stripped unknown 1 bytes]","data":"[stripped [stripped image/png 3 bytes] 1 bytes]"}'
      tokens:
        - {rule: d, mime: unknown, byte_size: 1}
        - {rule: b, mime: image/png, byte_size: 3}
    - name: context_is_read_before_the_pass
      note: mediaType is a non-empty string before the pass, so it is context for data, though rule (b) rewrites it in the same pass; the mime type is unknown, since the original value is not a valid mime. Stable on a second pass.
      input: '{"mediaType":"data:image/png;base64,QUFB","data":"QkJC"}'
      output: '{"mediaType":"[stripped image/png 3 bytes]","data":"[stripped unknown 3 bytes]"}'
      tokens:
        - {rule: b, mime: image/png, byte_size: 3}
        - {rule: e, mime: unknown, byte_size: 3}
    - name: context_is_read_before_the_pass_in_any_order
      note: The same members the other way round give the same bytes for each; only the token order follows the document.
      input: '{"data":"QkJC","mediaType":"data:image/png;base64,QUFB"}'
      output: '{"data":"[stripped unknown 3 bytes]","mediaType":"[stripped image/png 3 bytes]"}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 3}
        - {rule: b, mime: image/png, byte_size: 3}
    - name: output_format_is_read_before_the_pass
      note: output_format is context before rule (b) rewrites it; image/<value> is not a valid mime for a data URL value, so the mime type is unknown.
      input: '{"output_format":"data:image/png;base64,QUFB","b64_json":"QkJC"}'
      output: '{"output_format":"[stripped image/png 3 bytes]","b64_json":"[stripped unknown 3 bytes]"}'
      tokens:
        - {rule: b, mime: image/png, byte_size: 3}
        - {rule: e, mime: unknown, byte_size: 3}
    - name: a_second_pass_after_the_candidate_starts_to_parse
      note: The candidate does not parse because of the invalid escape \d inside the data URL, so pass 1 applies rule (b) alone, and the replacement removes the escape. The result parses, and its b64_json string is not a complete replacement, so a second pass applies rule (e) to it. This is the one input class where strip(strip(x)) differs from strip(x); no media survives in either pass.
      input: '{"output_format":"stripped image/png 3 bytes]","b64_json":"[stDATA:au\dio/wav;x=1;base64,UklGRg==ripped unknown 3 bytes]"}'
      output: '{"output_format":"stripped image/png 3 bytes]","b64_json":"[st[stripped unknown 4 bytes]ripped unknown 3 bytes]"}'
      tokens:
        - {rule: b, mime: unknown, byte_size: 4}
      second_output: '{"output_format":"stripped image/png 3 bytes]","b64_json":"[stripped unknown unknown bytes]"}'
      second_tokens:
        - {rule: e, mime: unknown, byte_size: unknown}
    - name: a_sibling_mime_that_is_not_a_token_is_unknown
      note: The mime_type sibling is a non-empty string, so it is context, but it is not a token/token mime, so the mime type is unknown and none of it reaches the replacement. The sibling itself is a data URL, stripped by rule (b).
      input: '{"data":"QUFB","mime_type":"data:image/png;base64,QUFB"}'
      output: '{"data":"[stripped unknown 3 bytes]","mime_type":"[stripped image/png 3 bytes]"}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 3}
        - {rule: b, mime: image/png, byte_size: 3}
    - name: a_mime_with_a_colon_is_no_data_url
      note: 'The mime type of rule (b) cannot hold a colon, so the first data: is no token start: the match begins at the second data: and the first stays as text.'
      input: 'data:data:image/png;base64,QUFB'
      output: 'data:[stripped image/png 3 bytes]'
      tokens:
        - {rule: b, mime: image/png, byte_size: 3}
    - name: a_colon_inside_the_mime_leaves_the_data_url
      note: 'Because the mime type cannot hold a colon, a data URL whose mime type or parameter has one (text/x:y) is not matched and stays as it came. This is the cost of keeping rule (b) linear.'
      input: 'data:text/x:y;base64,QUFB'
      output: 'data:text/x:y;base64,QUFB'
      tokens: []
    - name: duplicate_mime_keys_take_the_first_that_qualifies
      note: 'Both members are mediaType. The first is not a valid mime, so the second, the first that qualifies, gives the mime type.'
      input: '{"mediaType":"a b","mediaType":"image/png","data":"QUFB"}'
      output: '{"mediaType":"a b","mediaType":"image/png","data":"[stripped image/png 3 bytes]"}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 3}
    - name: duplicate_type_any_member_makes_a_buffer
      note: 'In the strip a condition on type holds when any member meets it, so one type member equal to Buffer makes this a Buffer object whatever the others say. Part building reads only the last type member instead (see part_shapes).'
      input: '{"file":{"type":"text","type":"Buffer","data":[1]}}'
      output: '{"file":"[stripped unknown 1 bytes]"}'
      tokens:
        - {rule: d, mime: unknown, byte_size: 1}
    - name: langchain_v1_base64_image
      note: Rule (e) through a typed key. A LangChain v1 standard content block holds its bytes under base64, and its type image is the context; the mime type comes from mime_type.
      input: '{"messages":[{"role":"user","content":[{"type":"text","text":"Describe this."},{"type":"image","base64":"iVBORw0KGgo=","mime_type":"image/png"}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"text","text":"Describe this."},{"type":"image","base64":"[stripped image/png 8 bytes]","mime_type":"image/png"}]}]}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: langchain_v1_blocks_of_every_media_type
      note: The type alone is the context, with or without a mime_type, for each of the block types that carry base64.
      input: '[{"type":"audio","base64":"UklGRg=="},{"type":"video","base64":"AAAA","mime_type":"video/mp4"},{"type":"file","base64":"JVBERi0=","mime_type":"application/pdf"},{"type":"text-plain","base64":"aGVsbG8=","mime_type":"text/plain"}]'
      output: '[{"type":"audio","base64":"[stripped unknown 4 bytes]"},{"type":"video","base64":"[stripped video/mp4 3 bytes]","mime_type":"video/mp4"},{"type":"file","base64":"[stripped application/pdf 5 bytes]","mime_type":"application/pdf"},{"type":"text-plain","base64":"[stripped text/plain 5 bytes]","mime_type":"text/plain"}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: 4}
        - {rule: e, mime: video/mp4, byte_size: 3}
        - {rule: e, mime: application/pdf, byte_size: 5}
        - {rule: e, mime: text/plain, byte_size: 5}
    - name: a_base64_key_beside_a_mime_type
      note: base64 is one of the keys, so a sibling mime key is context for it as for data, whatever the type.
      input: '{"base64":"QUFB","mime_type":"image/png"}'
      output: '{"base64":"[stripped image/png 3 bytes]","mime_type":"image/png"}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 3}
    - name: a_base64_key_with_no_media_context
      note: 'With no sibling mime key, no parent key and no media type, base64 is left alone: on its own, beside a type that names no media (text, image_url), and beside a format, which is not a sibling key.'
      input: '[{"base64":"QUFB"},{"type":"text","base64":"QUFB"},{"type":"image_url","base64":"QUFB"},{"base64":"QUFB","format":"png"}]'
      output: '[{"base64":"QUFB"},{"type":"text","base64":"QUFB"},{"type":"image_url","base64":"QUFB"},{"base64":"QUFB","format":"png"}]'
      tokens: []
    - name: a_typed_key_counts_when_any_type_member_qualifies
      note: As with Buffer and blob, a condition on type holds when any member meets it, so the second type member makes base64 a token.
      input: '{"type":"text","type":"image","base64":"QUFB"}'
      output: '{"type":"text","type":"image","base64":"[stripped unknown 3 bytes]"}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 3}
    - name: bedrock_converse_image_bytes
      note: 'Rule (e) through a source key. Bedrock Converse holds the bytes in {"image":{"format":"png","source":{"bytes":...}}}; the object holding bytes is the source, whatever its type. format sits on the image object, not beside bytes, so the mime type is unknown.'
      input: '{"messages":[{"role":"user","content":[{"image":{"format":"png","source":{"bytes":"iVBORw0KGgo="}}},{"text":"Describe this."}]}]}'
      output: '{"messages":[{"role":"user","content":[{"image":{"format":"png","source":{"bytes":"[stripped unknown 8 bytes]"}}},{"text":"Describe this."}]}]}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 8}
    - name: bedrock_converse_document_and_video_bytes
      note: A document and a video hold their bytes the same way.
      input: '[{"document":{"format":"pdf","name":"report","source":{"bytes":"JVBERi0="}}},{"video":{"format":"mp4","source":{"bytes":"AAAA"}}}]'
      output: '[{"document":{"format":"pdf","name":"report","source":{"bytes":"[stripped unknown 5 bytes]"}}},{"video":{"format":"mp4","source":{"bytes":"[stripped unknown 3 bytes]"}}}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: 5}
        - {rule: e, mime: unknown, byte_size: 3}
    - name: bedrock_converse_audio_bytes
      note: An audio block holds its bytes the same way. Its format names no mime type here either.
      input: '{"messages":[{"role":"user","content":[{"audio":{"format":"mp3","source":{"bytes":"SUQzBA=="}}},{"text":"Transcribe this."}]}]}'
      output: '{"messages":[{"role":"user","content":[{"audio":{"format":"mp3","source":{"bytes":"[stripped unknown 4 bytes]"}}},{"text":"Transcribe this."}]}]}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 4}
    - name: bytes_outside_a_source_is_left_alone
      note: bytes counts only in an object under source. Here it is at the top, directly in an image object, a number, and an empty string; an S3 location is a reference, not bytes.
      input: '{"bytes":"QUFB","image":{"format":"png","bytes":"QUFB"},"video":{"source":{"bytes":12,"s3Location":{"uri":"s3://bucket/clip.mp4"}}},"document":{"source":{"bytes":""}}}'
      output: '{"bytes":"QUFB","image":{"format":"png","bytes":"QUFB"},"video":{"source":{"bytes":12,"s3Location":{"uri":"s3://bucket/clip.mp4"}}},"document":{"source":{"bytes":""}}}'
      tokens: []
    - name: mistral_input_audio_string
      note: 'Rule (e) through a typed key. Mistral''s audio chunk holds the bare base64 as the string value of input_audio, beside the type input_audio. It names no format, so the mime type is unknown. OpenAI''s input_audio object (openai_input_audio_wav) is visited as before.'
      input: '{"messages":[{"role":"user","content":[{"type":"input_audio","input_audio":"UklGRiQAAABXQVZF"},{"type":"text","text":"Transcribe this."}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"input_audio","input_audio":"[stripped unknown 12 bytes]"},{"type":"text","text":"Transcribe this."}]}]}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 12}
    - name: mistral_typescript_input_audio_string
      note: 'Mistral''s TypeScript SDK spells the member inputAudio in the request object an app records, and only the wire form input_audio. It is a typed key too, beside the same type; with no type it is left alone.'
      input: '[{"type":"input_audio","inputAudio":"UklGRiQAAABXQVZF"},{"inputAudio":"UklGRg=="}]'
      output: '[{"type":"input_audio","inputAudio":"[stripped unknown 12 bytes]"},{"inputAudio":"UklGRg=="}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: 12}
    - name: input_audio_string_with_no_type_is_left_alone
      note: The input_audio string counts only beside the type input_audio.
      input: '{"input_audio":"UklGRg=="}'
      output: '{"input_audio":"UklGRg=="}'
      tokens: []
    - name: the_new_shapes_stripped_twice_change_nothing
      note: Complete replacements under base64, bytes and input_audio are not tokens, so a second pass over these shapes changes nothing.
      input: '[{"type":"image","base64":"[stripped image/png 8 bytes]","mime_type":"image/png"},{"image":{"format":"png","source":{"bytes":"[stripped unknown 8 bytes]"}}},{"type":"input_audio","input_audio":"[stripped unknown 12 bytes]"}]'
      output: '[{"type":"image","base64":"[stripped image/png 8 bytes]","mime_type":"image/png"},{"image":{"format":"png","source":{"bytes":"[stripped unknown 8 bytes]"}}},{"type":"input_audio","input_audio":"[stripped unknown 12 bytes]"}]'
      tokens: []
    - name: vercel_image_part_base64_in_ai_prompt
      note: 'Rule (e) through a typed key. A Vercel image part holds bare base64 under image, beside the type image; the mime type comes from mediaType.'
      input: '{"messages":[{"role":"user","content":[{"type":"text","text":"Describe this."},{"type":"image","image":"iVBORw0KGgo=","mediaType":"image/png"}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"text","text":"Describe this."},{"type":"image","image":"[stripped image/png 8 bytes]","mediaType":"image/png"}]}]}'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: vercel_image_part_base64_without_a_media_type
      note: The type image is the context on its own; with no mediaType the mime type is unknown.
      input: '[{"type":"image","image":"iVBORw0KGgo="}]'
      output: '[{"type":"image","image":"[stripped unknown 8 bytes]"}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: 8}
    - name: vercel_image_string_that_is_not_base64
      note: 'An image string with no URL scheme is base64 to the part rules, so it is a token here too, whatever it holds; it is not valid base64, so byte_size is unknown.'
      input: '[{"type":"image","image":"a cat on a mat"}]'
      output: '[{"type":"image","image":"[stripped unknown unknown bytes]"}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: unknown}
    - name: vercel_image_url_is_left_alone
      note: 'image keeps URLs: a string that starts with a URL scheme is no rule (e) token, and rule (b) finds no data URL in it, so http, https and gs links stay as they came.'
      input: '[{"type":"image","image":"https://example.com/a.png","mediaType":"image/png"},{"type":"image","image":"gs://bucket/a.png"}]'
      output: '[{"type":"image","image":"https://example.com/a.png","mediaType":"image/png"},{"type":"image","image":"gs://bucket/a.png"}]'
      tokens: []
    - name: vercel_image_data_url_keeps_its_own_mime
      note: 'A base64 data URL that is the whole value under image is left to rule (b), so it is replaced with the URL''s own mime type, not the part''s mediaType, and with its size.'
      input: '[{"type":"image","image":"data:image/jpeg;base64,/9j/4AAQSkZJRg==","mediaType":"image/png"}]'
      output: '[{"type":"image","image":"[stripped image/jpeg 10 bytes]","mediaType":"image/png"}]'
      tokens:
        - {rule: b, mime: image/jpeg, byte_size: 10}
    - name: vercel_tagged_file_data_in_ai_prompt
      note: 'Rule (e) through the typed key data under the type data and the parent key data. The tag object names no mime type, so it reads the file part''s mediaType, as rule (d) does.'
      input: '{"messages":[{"role":"user","content":[{"type":"file","data":{"type":"data","data":"JVBERi0="},"mediaType":"application/pdf"}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"file","data":{"type":"data","data":"[stripped application/pdf 5 bytes]"},"mediaType":"application/pdf"}]}]}'
      tokens:
        - {rule: e, mime: application/pdf, byte_size: 5}
    - name: vercel_tagged_image_data
      note: An image part's image holds tagged data the same way, under the parent key image; with no mediaType on the part the mime type is unknown.
      input: '[{"type":"image","image":{"type":"data","data":"iVBORw0KGgo="}},{"type":"image","image":{"type":"data","data":"iVBORw0KGgo="},"mediaType":"image/png"}]'
      output: '[{"type":"image","image":{"type":"data","data":"[stripped unknown 8 bytes]"}},{"type":"image","image":{"type":"data","data":"[stripped image/png 8 bytes]"},"mediaType":"image/png"}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: 8}
        - {rule: e, mime: image/png, byte_size: 8}
    - name: vercel_tagged_data_url_and_link
      note: 'Tagged data keeps URLs too: a base64 data URL that is the whole value gets rule (b) with its own mime type, and an https link stays.'
      input: '[{"type":"file","data":{"type":"data","data":"data:application/pdf;base64,JVBERi0="},"mediaType":"application/pdf"},{"type":"file","data":{"type":"data","data":"https://example.com/a.pdf"},"mediaType":"application/pdf"}]'
      output: '[{"type":"file","data":{"type":"data","data":"[stripped application/pdf 5 bytes]"},"mediaType":"application/pdf"},{"type":"file","data":{"type":"data","data":"https://example.com/a.pdf"},"mediaType":"application/pdf"}]'
      tokens:
        - {rule: b, mime: application/pdf, byte_size: 5}
    - name: a_wrapped_base64_data_url_under_a_url_key_is_replaced_whole
      note: 'A key that keeps URLs leaves a data URL to rule (b) only when rule (b)''s pattern matches the whole value. A base64 run wrapped at a newline (base64.encodebytes, a MIME encoder) ends the match early, so the value stays a rule (e) token and is replaced whole: no base64 after the break survives. Under image and tagged data, and under a plain data beside mediaType, alike; the mime type is the key''s usual one, never the data URL''s.'
      input: '[{"type":"image","image":"data:image/png;base64,iVBO\nRw0KGgo="},{"type":"image","image":{"type":"data","data":"data:image/png;base64,iVBO\nRw0KGgo="}},{"type":"file","data":"data:image/png;base64,iVBO\nRw0KGgo=","mediaType":"image/png"},{"type":"file","data":{"type":"data","data":"data:image/png;base64,iVBO\nRw0KGgo="},"mediaType":"image/png"}]'
      output: '[{"type":"image","image":"[stripped unknown unknown bytes]"},{"type":"image","image":{"type":"data","data":"[stripped unknown unknown bytes]"}},{"type":"file","data":"[stripped image/png unknown bytes]","mediaType":"image/png"},{"type":"file","data":{"type":"data","data":"[stripped image/png unknown bytes]"},"mediaType":"image/png"}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: unknown}
        - {rule: e, mime: unknown, byte_size: unknown}
        - {rule: e, mime: image/png, byte_size: unknown}
        - {rule: e, mime: image/png, byte_size: unknown}
    - name: a_percent_encoded_data_url_under_a_url_key_is_replaced_whole
      note: 'A data URL that is not base64 holds no rule (b) token, so under a key that keeps URLs it is a rule (e) token, tagged or not, the scheme in any case: the same Vercel payload is stripped whichever way it is written.'
      input: '[{"type":"file","data":{"type":"data","data":"data:image/png,%89PNG"},"mediaType":"image/png"},{"type":"file","data":"data:image/png,%89PNG","mediaType":"image/png"},{"type":"image","image":"DATA:image/png,%89PNG"},{"type":"image","image":{"type":"data","data":"DATA:image/png,%89PNG"}}]'
      output: '[{"type":"file","data":{"type":"data","data":"[stripped image/png unknown bytes]"},"mediaType":"image/png"},{"type":"file","data":"[stripped image/png unknown bytes]","mediaType":"image/png"},{"type":"image","image":"[stripped unknown unknown bytes]"},{"type":"image","image":{"type":"data","data":"[stripped unknown unknown bytes]"}}]'
      tokens:
        - {rule: e, mime: image/png, byte_size: unknown}
        - {rule: e, mime: image/png, byte_size: unknown}
        - {rule: e, mime: unknown, byte_size: unknown}
        - {rule: e, mime: unknown, byte_size: unknown}
    - name: a_broken_base64_run_under_a_url_key_is_replaced_whole
      note: 'Rule (b) matches data:image/png;base64, with an empty run and stops before @@@, so it does not reach the end of the value: the value is a rule (e) token, tagged or not.'
      input: '[{"type":"image","image":"data:image/png;base64,@@@"},{"type":"image","image":{"type":"data","data":"data:image/png;base64,@@@"}},{"type":"file","data":"data:image/png;base64,@@@","mediaType":"image/png"},{"type":"file","data":{"type":"data","data":"data:image/png;base64,@@@"},"mediaType":"image/png"}]'
      output: '[{"type":"image","image":"[stripped unknown unknown bytes]"},{"type":"image","image":{"type":"data","data":"[stripped unknown unknown bytes]"}},{"type":"file","data":"[stripped image/png unknown bytes]","mediaType":"image/png"},{"type":"file","data":{"type":"data","data":"[stripped image/png unknown bytes]"},"mediaType":"image/png"}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: unknown}
        - {rule: e, mime: unknown, byte_size: unknown}
        - {rule: e, mime: image/png, byte_size: unknown}
        - {rule: e, mime: image/png, byte_size: unknown}
    - name: image_and_tagged_data_outside_their_parts_are_left_alone
      note: 'image counts only beside the type image, and tagged data only under the parent key data or image: an image string with no type, beside the type text or image_url, and a type data object at the top or under another key are left alone.'
      input: '[{"image":"iVBORw0KGgo="},{"type":"text","image":"iVBORw0KGgo="},{"type":"image_url","image":"iVBORw0KGgo="},{"type":"data","data":"iVBORw0KGgo="},{"x":{"type":"data","data":"iVBORw0KGgo="}}]'
      output: '[{"image":"iVBORw0KGgo="},{"type":"text","image":"iVBORw0KGgo="},{"type":"image_url","image":"iVBORw0KGgo="},{"type":"data","data":"iVBORw0KGgo="},{"x":{"type":"data","data":"iVBORw0KGgo="}}]'
      tokens: []
    - name: tagged_data_outside_a_vercel_part_is_left_alone
      note: 'Tagged data counts only when the object holding it is a Vercel file or image part (holder_types): an envelope {"data":{"type":"data",...}} from another API, tagged data under image with no part around it, and tagged data in a text object are left alone; in a file part it is a token.'
      input: '[{"data":{"type":"data","data":"hello world"}},{"image":{"type":"data","data":"iVBORw0KGgo="}},{"type":"text","data":{"type":"data","data":"iVBORw0KGgo="}},{"type":"file","data":{"type":"data","data":"iVBORw0KGgo="},"mediaType":"image/png"}]'
      output: '[{"data":{"type":"data","data":"hello world"}},{"image":{"type":"data","data":"iVBORw0KGgo="}},{"type":"text","data":{"type":"data","data":"iVBORw0KGgo="}},{"type":"file","data":{"type":"data","data":"[stripped image/png 8 bytes]"},"mediaType":"image/png"}]'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
    - name: langchain_v0_base64_block_without_a_mime_type
      note: 'Rule (e) through a base64 marker. A LangChain v0 block {"type":"image","source_type":"base64","data":...} with no mime_type: source_type base64 is the context for data, and the mime type is unknown.'
      input: '{"messages":[{"role":"user","content":[{"type":"text","text":"Describe this."},{"type":"image","source_type":"base64","data":"iVBORw0KGgo="}]}]}'
      output: '{"messages":[{"role":"user","content":[{"type":"text","text":"Describe this."},{"type":"image","source_type":"base64","data":"[stripped unknown 8 bytes]"}]}]}'
      tokens:
        - {rule: e, mime: unknown, byte_size: 8}
    - name: langchain_v0_base64_blocks_with_a_mime_type
      note: With a mime_type the mime type comes from it, for every block type.
      input: '[{"type":"image","source_type":"base64","data":"iVBORw0KGgo=","mime_type":"image/png"},{"type":"audio","source_type":"base64","data":"UklGRg==","mime_type":"audio/wav"},{"type":"file","source_type":"base64","data":"JVBERi0=","mime_type":"application/pdf"}]'
      output: '[{"type":"image","source_type":"base64","data":"[stripped image/png 8 bytes]","mime_type":"image/png"},{"type":"audio","source_type":"base64","data":"[stripped audio/wav 4 bytes]","mime_type":"audio/wav"},{"type":"file","source_type":"base64","data":"[stripped application/pdf 5 bytes]","mime_type":"application/pdf"}]'
      tokens:
        - {rule: e, mime: image/png, byte_size: 8}
        - {rule: e, mime: audio/wav, byte_size: 4}
        - {rule: e, mime: application/pdf, byte_size: 5}
    - name: langchain_v0_blocks_with_no_base64_marker_are_left_alone
      note: 'Only source_type base64 is a marker. A url block keeps its link, data beside source_type url is not a token, and neither is data beside the type image alone; a block by id holds nothing to strip.'
      input: '[{"type":"image","source_type":"url","url":"https://example.com/a.png"},{"type":"image","source_type":"url","data":"iVBORw0KGgo="},{"type":"image","data":"iVBORw0KGgo="},{"type":"file","source_type":"id","id":"file-abc123"}]'
      output: '[{"type":"image","source_type":"url","url":"https://example.com/a.png"},{"type":"image","source_type":"url","data":"iVBORw0KGgo="},{"type":"image","data":"iVBORw0KGgo="},{"type":"file","source_type":"id","id":"file-abc123"}]'
      tokens: []
    - name: a_base64_marker_reaches_data_alone
      note: 'source_type base64 is context for data in its own object and for no other key: result and b64_json beside it stay, with or without a data member.'
      input: '[{"source_type":"base64","result":"ok","b64_json":"yes"},{"type":"text","source_type":"base64","data":"iVBORw0KGgo=","result":"iVBORw0KGgo="}]'
      output: '[{"source_type":"base64","result":"ok","b64_json":"yes"},{"type":"text","source_type":"base64","data":"[stripped unknown 8 bytes]","result":"iVBORw0KGgo="}]'
      tokens:
        - {rule: e, mime: unknown, byte_size: 8}
    - name: the_vercel_and_langchain_v0_shapes_stripped_twice_change_nothing
      note: Complete replacements under image, tagged data and a v0 block's data are not tokens, so a second pass over these shapes changes nothing.
      input: '[{"type":"image","image":"[stripped image/png 8 bytes]","mediaType":"image/png"},{"type":"file","data":{"type":"data","data":"[stripped application/pdf 5 bytes]"},"mediaType":"application/pdf"},{"type":"image","source_type":"base64","data":"[stripped unknown 8 bytes]"}]'
      output: '[{"type":"image","image":"[stripped image/png 8 bytes]","mediaType":"image/png"},{"type":"file","data":{"type":"data","data":"[stripped application/pdf 5 bytes]"},"mediaType":"application/pdf"},{"type":"image","source_type":"base64","data":"[stripped unknown 8 bytes]"}]'
      tokens: []
  # How an SDK writes a byte object into a value it serializes. Each example's
  # attribute value holds the marker and is final: a strip changes nothing.
  byte_objects:
    rule: >-
      When an SDK serializes a value that is not a string into an attribute (an
      input or output it records, a tool's arguments or result), every byte
      object in it is written as the replacement with the unknown mime,
      `[stripped unknown <N> bytes]`, where N is its size in bytes (see size),
      as a JSON string literal in the place the value had. The byte objects are
      the types listed below for each SDK, subclasses included, and in
      TypeScript those of another realm too (a vm context, an iframe). The mime is
      always unknown, never read from a sibling such as mediaType: a serializer
      writes each value on its own. A byte object at the root is serialized like
      any other value that is not a string, so the attribute holds the JSON
      string literal, quotes included. An object key is never a byte object.
      The strip then runs as on any value, and since the marker is a complete
      replacement it is never stripped again and is never context for rule (e)
      (see idempotence). Rule (d) and this rule meet at the Node Buffer. A
      Buffer is a Uint8Array, so the TypeScript SDK writes it as this marker; it
      must read each value from its holder, as JSON.stringify calls a Buffer's
      toJSON, which writes {"type":"Buffer","data":[...]}, before a replacer
      sees the value. Rule (d) is for a Buffer that became that object before
      an SDK saw it, in a string another library serialized (the AI SDK's
      ai.prompt), and for the sink. Both count the same bytes; rule (d) may
      also read a mime type from the enclosing object, which this rule never
      does.
    size: >-
      The size in bytes, never a count of items. Python: len of bytes and
      bytearray, nbytes of memoryview (so a memoryview cast to 4-byte items
      counts 4 per item); a released memoryview has no size, and its marker's
      size is unknown. TypeScript: byteLength of an ArrayBuffer, a
      SharedArrayBuffer and every ArrayBuffer view (ArrayBuffer.isView: each
      typed array, a Node Buffer and a DataView), the view's own length, not
      its buffer's.
    # A byte object set as an attribute value itself: no serializer is around
    # it, so it is the bare marker, never a JSON string literal.
    attribute_values:
      rule: >-
        A byte object used directly as an OpenTelemetry attribute value (of a
        span, an event or a link), or anywhere inside one (an element of an
        array or a value of a mapping, at any depth), has no serializer around
        it: it becomes the marker as a bare string, `[stripped unknown <N>
        bytes]`, with no JSON quotes, and N its size by the size rule above.
        Every other value is kept. An OpenTelemetry array is homogeneous, so
        each array is looked at on its own once its elements are replaced. One
        that held a byte object and whose elements are then all strings is
        that array of strings. One that held a byte object beside any element
        that is then no string (a number, a bool, null, an array, a mapping)
        is instead one string: the JSON the SDK serializes the array to under
        the rule above, `[1,"[stripped unknown 2 bytes]"]`, its numbers
        written as that SDK writes them. An array that held no byte object is
        kept, its elements walked. The SDK then sets the walked value in the
        form its OpenTelemetry attribute API holds. OpenTelemetry Python holds a
        mapping and a nested array, so it sets them as they are. OpenTelemetry
        JS holds neither, so a walked value that held a byte object and is
        then a mapping or an array holding an array or a mapping is set as one
        string: the JSON the SDK serializes the value to under the rule above,
        every byte object a quoted marker and every array an array, so
        `{k: [1, bytes]}` is `{"k":[1,"[stripped unknown 2 bytes]"]}`, encoded
        once, never holding a mixed array's own JSON as a string. The sink does the same with an OTLP
        AnyValue: a bytes_value, alone or at any depth of array_value and
        kvlist_value, is the marker, N the number of bytes it holds, and an
        array_value that mixes a bytes_value with a value that is then no
        string is its compact JSON, an int_value written as a JSON number and
        a kvlist_value as an object. In OTLP JSON a bytes_value is base64:
        the proto3 JSON mapping writes it in the standard alphabet with
        padding, and a parser accepts the standard or the URL-safe alphabet,
        padded or not, so N is the length it decodes to (`_-__` is 3 bytes,
        `iVBORw0KGgo` 8). This differs from the root of a serialized value
        (above), which is JSON and so quoted. generators/media_parts.py
        attribute_value and otlp_attribute_value are the reference, and the
        TypeScript examples run through the replacer the tests hold; each
        example's output is the attribute value the SDK sets: a string, an
        array of them, a mapping (Python and the sink), or an array's or a
        mapping's JSON.
      examples:
        - name: python_bytes_attribute
          language: python
          value: 'b"\x89PNG"'
          output: '[stripped unknown 4 bytes]'
        - name: python_byte_objects_in_an_array_attribute
          language: python
          value: '[b"ab", bytearray(3), memoryview(bytes(8)).cast("I")]'
          output: ['[stripped unknown 2 bytes]', '[stripped unknown 3 bytes]', '[stripped unknown 8 bytes]']
        - name: python_byte_objects_beside_strings_in_an_array_attribute
          language: python
          note: Strings and markers are all strings, so the array stays an array.
          value: '["a", b"ab"]'
          output: ['a', '[stripped unknown 2 bytes]']
        - name: python_byte_objects_in_a_mapping_and_a_nested_array
          language: python
          value: '{"k": b"ab", "n": [[b"abc"], ["x"]], "i": 1}'
          output: {k: '[stripped unknown 2 bytes]', n: [['[stripped unknown 3 bytes]'], ['x']], i: 1}
        - name: python_byte_object_beside_a_number
          language: python
          note: An array of a number and a marker would not be homogeneous, so it is the array's JSON.
          value: '[1, b"ab"]'
          output: '[1,"[stripped unknown 2 bytes]"]'
        - name: python_byte_object_in_a_mapping
          language: python
          note: OpenTelemetry Python holds a mapping, so it is set as a mapping.
          value: '{"img": b"abc"}'
          output: {img: '[stripped unknown 3 bytes]'}
        - name: python_byte_object_beside_a_number_in_a_mapping
          language: python
          note: The mixed array is its JSON, and the mapping around it stays a mapping.
          value: '{"k": [1, b"ab"]}'
          output: {k: '[1,"[stripped unknown 2 bytes]"]'}
        - name: python_byte_object_beside_a_number_in_a_nested_array
          language: python
          note: The inner array is its JSON, so the outer one is an array of strings.
          value: '[[1, b"a"]]'
          output: ['[1,"[stripped unknown 1 bytes]"]']
        - name: typescript_buffer_attribute
          language: typescript
          value: 'Buffer.from([137, 80, 78, 71])'
          output: '[stripped unknown 4 bytes]'
        - name: typescript_byte_objects_in_an_array_attribute
          language: typescript
          value: '[new Uint8Array(2), new ArrayBuffer(3)]'
          output: ['[stripped unknown 2 bytes]', '[stripped unknown 3 bytes]']
        - name: typescript_byte_objects_beside_strings_in_an_array_attribute
          language: typescript
          value: '[new Uint8Array(2), "x"]'
          output: ['[stripped unknown 2 bytes]', 'x']
        - name: typescript_byte_objects_in_a_mapping_and_a_nested_array
          language: typescript
          note: OpenTelemetry JS holds no mapping, so the mapping is its JSON, one string. A Uint16Array of 2 items is 4 bytes.
          value: '{ k: new Uint16Array(2), n: [[new DataView(new ArrayBuffer(3))], ["x"]] }'
          output: '{"k":"[stripped unknown 4 bytes]","n":[["[stripped unknown 3 bytes]"],["x"]]}'
        - name: typescript_byte_object_in_a_nested_array
          language: typescript
          note: OpenTelemetry JS holds no nested array, so the array is its JSON.
          value: '[[new Uint8Array(3)], ["x"]]'
          output: '[["[stripped unknown 3 bytes]"],["x"]]'
        - name: typescript_byte_object_beside_a_number
          language: typescript
          value: '[1, new Uint8Array(2)]'
          output: '[1,"[stripped unknown 2 bytes]"]'
        - name: typescript_byte_object_beside_a_number_in_a_mapping
          language: typescript
          note: The mapping is its JSON, encoded once, so the mixed array in it is an array, not its own JSON as a string.
          value: '{ k: [1, new Uint8Array(2)] }'
          output: '{"k":[1,"[stripped unknown 2 bytes]"]}'
        - name: typescript_byte_object_beside_a_number_in_a_nested_array
          language: typescript
          note: The inner array is its JSON, so the outer one is an array of strings, which OpenTelemetry JS holds.
          value: '[[1, new Uint8Array(1)]]'
          output: ['[1,"[stripped unknown 1 bytes]"]']
        - name: otlp_bytes_value
          language: otlp
          note: An OTLP JSON AnyValue; the protobuf bytes_value is the same 8 bytes.
          value: '{"bytesValue":"iVBORw0KGgo="}'
          output: '[stripped unknown 8 bytes]'
        - name: otlp_bytes_values_in_an_array_value
          language: otlp
          value: '{"arrayValue":{"values":[{"bytesValue":"QUJD"},{"bytesValue":""},{"stringValue":"plain"}]}}'
          output: ['[stripped unknown 3 bytes]', '[stripped unknown 0 bytes]', 'plain']
        - name: otlp_bytes_values_url_safe_and_unpadded
          language: otlp
          note: 'A protobuf JSON parser reads _-__ (URL-safe) as 3 bytes and iVBORw0KGgo (unpadded) as 8.'
          value: '{"arrayValue":{"values":[{"bytesValue":"_-__"},{"bytesValue":"iVBORw0KGgo"}]}}'
          output: ['[stripped unknown 3 bytes]', '[stripped unknown 8 bytes]']
        - name: otlp_bytes_values_in_a_kvlist_value_and_a_nested_array_value
          language: otlp
          value: '{"kvlistValue":{"values":[{"key":"k","value":{"bytesValue":"iVBORw0KGgo="}},{"key":"n","value":{"arrayValue":{"values":[{"arrayValue":{"values":[{"bytesValue":"QUJD"}]}}]}}},{"key":"i","value":{"intValue":"1"}}]}}'
          output: {k: '[stripped unknown 8 bytes]', n: [['[stripped unknown 3 bytes]']], i: 1}
        - name: otlp_bytes_value_beside_an_int_value
          language: otlp
          value: '{"arrayValue":{"values":[{"intValue":"1"},{"bytesValue":"QUI="}]}}'
          output: '[1,"[stripped unknown 2 bytes]"]'
    python: [bytes, bytearray, memoryview]
    typescript: [ArrayBuffer, SharedArrayBuffer, 'every ArrayBuffer view (ArrayBuffer.isView): each typed array, Buffer and DataView']
    examples:
      - name: python_bytes_in_a_dict
        language: python
        value: '{"image": b"\x89PNG"}'
        output: '{"image":"[stripped unknown 4 bytes]"}'
      - name: python_bytearray_and_memoryview
        language: python
        value: '[bytearray(b"abc"), memoryview(b"abcdef")[2:]]'
        output: '["[stripped unknown 3 bytes]","[stripped unknown 4 bytes]"]'
      - name: python_memoryview_counts_bytes_not_items
        language: python
        note: The view has 2 items of 4 bytes, so its size is 8. At the root, the attribute is the JSON string literal.
        value: 'memoryview(bytes(8)).cast("I")'
        output: '"[stripped unknown 8 bytes]"'
      - name: python_bytes_beside_a_media_type
        language: python
        note: 'The mime is unknown though mediaType names one, and the strip that follows leaves the marker: it is a complete replacement.'
        value: '{"type": "file", "data": b"\x89PNG", "mediaType": "image/png"}'
        output: '{"type":"file","data":"[stripped unknown 4 bytes]","mediaType":"image/png"}'
      - name: python_empty_bytes
        language: python
        value: '{"data": b""}'
        output: '{"data":"[stripped unknown 0 bytes]"}'
      - name: typescript_uint8array
        language: typescript
        value: '{ u: new Uint8Array(3) }'
        output: '{"u":"[stripped unknown 3 bytes]"}'
      - name: typescript_node_buffer_is_a_byte_object
        language: typescript
        note: 'A Buffer is written as the marker, never as {"type":"Buffer","data":[...]}, so its mime is unknown: compare vercel_buffer_in_ai_prompt, where rule (d) strips a Buffer the AI SDK serialized.'
        value: '{ type: "file", data: Buffer.from([137, 80, 78, 71]), mediaType: "image/png" }'
        output: '{"type":"file","data":"[stripped unknown 4 bytes]","mediaType":"image/png"}'
      - name: typescript_typed_array_counts_bytes_not_items
        language: typescript
        note: Two 2-byte items are 4 bytes. At the root, the attribute is the JSON string literal.
        value: 'new Uint16Array(2)'
        output: '"[stripped unknown 4 bytes]"'
      - name: typescript_array_buffer_and_data_view
        language: typescript
        note: A view counts its own length, not its buffer's.
        value: '[new ArrayBuffer(5), new DataView(new ArrayBuffer(8), 2, 3)]'
        output: '["[stripped unknown 5 bytes]","[stripped unknown 3 bytes]"]'

part_shapes:
  # The exact serialized form of a normalized part in a message key. The
  # members of each type appear in exactly this order.
  members:
    blob: [type, modality, mime_type, byte_size, stripped_reason]
    uri: [type, modality, mime_type, uri]
    file: [type, modality, mime_type, file_id]
  # A filename extension gives the modality where the rules below read one.
  # The extension is the text after the last '.' of the file name, matched
  # with ASCII case folding only (A.WAV is audio; no other letter is folded).
  # A filename member is the file name. For a URI, the query and fragment are
  # cut first, nothing is percent-decoded, and the file name is the text
  # after the last '/'. Any other extension, or none, is document.
  extensions:
    image: [png, jpg, jpeg, gif, webp]
    audio: [wav, mp3, m4a, ogg, flac]
    video: [mp4, mov, webm]
  rules:
    - Members appear in exactly the order of members, and no member appears twice.
    - A member whose value is unknown is omitted, never written as null. This applies to mime_type and byte_size.
    - mime_type is written only when it is a valid token/token MIME type, matching the replacement's mime_pattern in full. Anything else is omitted.
    - The modality is taken from the prefix of the MIME type, matched case-insensitively. image/* is image, audio/* audio, video/* video, anything else document.
    - 'Every native media part in a message key (blob, uri or file) is always rebuilt into its canonical shape: members in the pinned order, extra members dropped, and every member that is unknown omitted. The only exception is a uri part whose uri is not a string, or a file part whose file_id is not a string: it is left as it came. Any string is a usable uri or file_id, the empty string included. An object of type file that holds a base64 or a url that is a string is no native file part but a LangChain v1 file block, read by the v1 rule below: so {"type":"file","file_id":5,"url":"https://example.com/a.wav"} is a uri, while {"type":"file","file_id":5} is a native file part left as it came. Every other normalized media part carries a modality.'
    - 'Parts are rebuilt only in a message-key value that parses as JSON and nests at most 1000 levels deep. Arrays and objects count together from the value''s root, which is level 1: the message array, a message, its parts array and a tool call part are 4 levels. A value nested deeper (a tool call whose arguments add 997 more arrays makes 1001 levels) is left as it came, every part in it included; at 1000 levels its parts are rebuilt. The implementation counts the depth itself and never relies on its parser''s or its language''s recursion limit. The strip still runs on a value left this way.'
    - 'The modality that the part already has is kept, when it is one of modalities (any other value is ignored), except for a blob whose content is a string and a uri holding a data URL (below). Otherwise it is taken from the MIME type. Failing that, a provider item whose kind names a modality takes it from the kind: an image, image_url, input_image or image_generation_call item is image, an input_audio item audio, a document item document. A LangChain v1 block of type image, audio or video is that modality; a block of type file names none, so by a url that is not a data URL it takes the modality from the extension of the URL''s path (see extensions), and otherwise it is document. A text-plain block by base64 names none either and is document (one by url or file_id makes no part). A Bedrock Converse image, video, audio or document block is that modality. An OpenAI file or input_file item names none; its modality comes from the extension of its filename member alone (never from a file_url), and with no filename, or an empty one, it is document. A Gemini file_data, a native uri and a Vercel file part by URL take it from the extension of their URI''s path (see extensions), the Vercel part whether its URL is a plain string or v7''s {"type":"url"} data; a Vercel image part is an image. Otherwise it is document. So an Anthropic document by URL ending in .png is a document, an OpenAI input_file named a.png is an image, and an input_file by a file_url ending in .png with no filename is a document; a LangChain v1 image block by a URL ending in .bin is an image, and a v1 file block by a URL ending in .wav is audio. A native file part with no valid modality and no MIME type gets document; no member of it is read for an extension. Any other part with no MIME type and no other hint also gets document.'
    - 'A blob whose `content` is a string is rebuilt with stripped_reason not_captured and a byte_size taken from the content under the size rule of the strip (omitted when the size is unknown). Its modality comes from its MIME type first, then from the modality it has, then document: a PDF blob labelled image is a document. A content string that is itself a data URL follows the data URL rules below, with the part''s mime_type as the hint and the same modality order. A blob in a message key never carries content.'
    - 'A blob with no string `content` keeps a stripped_reason that is one of stripped_reasons. Otherwise its stripped_reason is redacted_upstream when it has no content member or a null one, and not_captured when its content is any other value. It keeps a byte_size that is a whole, non-negative number no larger than 2^53 - 1 (8, 8.0 and 8e0 alike, written 8); any other byte_size is omitted.'
    - 'A uri part, or a provider uri such as a Gemini file_data, whose URI is a data URL is never a uri: it becomes a blob under the data URL rules below. Nor is a native uri part whose uri holds data: anywhere else, in any ASCII case (a uri led by whitespace, or a link with a data URL after it): it becomes a blob with the stripped_reason not_captured and no byte_size, its mime_type kept when valid, so no byte of the data URL survives. A native uri part takes that blob''s modality as a blob whose content is a string does: from the MIME type first, then the modality it has, then document.'
    - 'A URL of any scheme other than data: is a uri, its link kept as written: http, https, gs, s3, file and any other scheme alike. Only a data: URL, or inline data, becomes a blob, and a native uri or a LangChain v1 url that holds data: anywhere else (above and below). Where one value may hold either a URL or bare base64 (a Vercel file part''s data or image part''s image, as a plain string or as v7''s {"type":"data"} data), it is a URL when it starts with a scheme: an ASCII letter, then any ASCII letters, digits, `+`, `-` or `.`, then a colon. Base64 holds no colon, so the two never meet; anything else is base64. A value v7 tags {"type":"url"} is a URL whatever it holds. The strip reads these values the same way: rule (e) leaves a value that starts with a scheme to rule (b) (raw_payloads, rule (e)''s url_scheme and keeps_urls), except a data: value that rule (b)''s pattern does not match in full, which rule (e) replaces whole, as the part rules make it a blob.'
    - 'In a provider media item, a URL or a file id that is empty, or that is the __REDACTED__ marker an instrumentor writes in its place, was dropped upstream. When the item has no other usable reference (one that is neither empty nor __REDACTED__), it becomes a blob with the stripped_reason redacted_upstream and no byte_size. It keeps the MIME type the item gives (an Anthropic source''s media_type, a Gemini file_data''s mime_type, a Vercel part''s mediaType) and takes its modality by the rule above, so an image_url or input_image is image. This covers an image_url''s url, an input_image''s image_url and file_id, an Anthropic url or file source, a Gemini file_data''s file_uri, a Vercel part''s v7 {"type":"url"} data, an OpenAI file or input_file''s file_id, file_data and file_url (an empty file_data counts as dropped too, since its item has nothing else to point to), and a LangChain v1 image, audio, video or file block''s url and an image, audio or video block''s file_id. An OpenAI file or input_file with no usable reference becomes this blob too when it has no reference member at all, or only ones that are not strings (a file_id of 5 or null): its type file would otherwise collide with a native file part. A usable reference wins: an input_image whose image_url is __REDACTED__ and whose file_id is usable is a file, and an OpenAI file with an empty file_id and non-empty file_data is a blob of that data. It matches OpenInference''s __REDACTED__ on the flattened path. So no provider item this rule covers is left as a part of type file without a file_id. A native uri or file part is no provider item: its empty uri or file_id is kept, and so is that of a LangChain v1 file block with no other usable reference (no base64 but an empty or __REDACTED__ one, and no usable url), since such a block has a native file part''s shape and is read as one (below); a v1 file block that has one is read by it, as the usable reference wins. Nor is a reference not yet mapped to a part (a Bedrock Converse source by s3Location): it stays as it came, empty or not.'
    - 'A Vercel file part whose data, or image part whose image, is neither a string nor v7 tagged data holding one makes no part: it is dropped from its message''s parts, never written as a bare {"type":"file"} or {"type":"image"}, and any raw payload holding its bytes is stripped per raw_payloads. So is a v7 {"type":"text"} whose text is not a string. A v7 tag no rule here names becomes a blob with the stripped_reason not_captured and no byte_size, keeping the part''s mediaType: its size was never measured.'
    - 'A LangChain v1 standard content block of type image, audio, video or file, or of type text-plain, makes one part, by the first of these that applies. A usable url or file_id is a string that is neither empty nor __REDACTED__. (1) A block of type file whose file_id is usable, a string that is neither empty nor __REDACTED__, is a native file part, whatever else it holds (a url, a base64, even an OpenAI-style file member): it is rebuilt as one (above), its mime_type kept when valid, and its modality by the native order: its own modality member when that is one of modalities, else from the MIME type, else document. (2) A base64 that is a string is a blob (the bare base64 rule below): an empty one is 0 bytes, and __REDACTED__, which is valid base64, is 9, as for any bare base64 payload. The one exception is a block of type file whose file_id is a string: there an empty or __REDACTED__ base64 is no usable reference, and the block reads on, so it never beats an empty file_id. (3) A usable file_id is a file part. (4) A usable url that is a data URL is a blob under the data URL rules, the block''s mime_type the hint: a data URL that rule (b)''s pattern does not match in full (a run wrapped at a newline, a trailing space, a percent-encoded payload) is a blob with no byte_size. A usable url that holds data: anywhere else, in any ASCII case (one led by whitespace, or a link with a data URL after it), is a blob with the stripped_reason not_captured and no byte_size, so no byte of it is kept. Any other usable url is a uri, its value kept as it came, whatever its scheme and relative or not: {"type":"image","url":"/img/a.png"} is a uri. (5) A block of type file whose file_id is a string, and that reached here with no other usable reference, has a native file part''s shape and is one, rebuilt as in (1): its file_id is kept as written, empty or __REDACTED__ included. (6) When url or file_id is a string but none is usable, the block becomes a blob with the stripped_reason redacted_upstream and no byte_size (above). So a usable reference wins over an empty or __REDACTED__ file_id for every block type: {"type":"file","file_id":"","url":"https://example.com/a.pdf"} is a uri, and {"type":"file","file_id":""} alone is a file part. Nor does an empty or __REDACTED__ base64 beside one: {"type":"file","file_id":"","base64":""} is a file part by (5), while {"type":"image","base64":""} is a 0-byte blob by (2). A text-plain block is read by its base64 alone, in (2), and is document unless its mime_type names another modality; by url or file_id it makes no part and stays as it came. Every one keeps the block''s mime_type when it is valid and takes its modality by the rule above. A block with no base64, url or file_id that is a string makes no part this way and stays as it came. In every case but a native file part ((1) and (5)), only type, base64, url, file_id and mime_type are read, a modality member included in none; a native file part is read as one, so its valid modality member comes first. So a LangChain v0 block by url ({"type":"image","source_type":"url","url":...}) is read the same way, and a v0 block by base64 or by id holds none of them and stays as it came, its data stripped per raw_payloads. generators/media_parts.py langchain_v1_part(data, block) is the reference, and each v1 example''s block is its test. A block is read the same way on every path that delivers it: passthrough, and the provider blocks OpenLLMetry and Laminar write as gen_ai.prompt.N.content.'
    - 'When a part has duplicate `type` members, the last one wins, as in a standard JSON decoder. The strip is different: there, a condition on `type` holds when any member qualifies.'
    - 'A base64 data URL (rule (b)''s pattern matching the whole string) becomes a blob with the stripped_reason not_captured. Its mime type is the URL''s when that is a valid token/token MIME type, else the hint (a native part''s mime_type). Its byte_size is that of the base64 run under the size rule of the strip: an empty run is 0 bytes, and an invalid run has no byte_size.'
    - 'A provider item''s bare base64 payload (an input_audio data, a Mistral input_audio or inputAudio string, an Anthropic base64 source''s data, a LangChain v1 block''s base64 (but an empty or __REDACTED__ one beside a file block''s string file_id, below), a Bedrock Converse source''s bytes, an image_generation_call result, a Gemini inline_data data, a Vercel file part''s data or image part''s image, a non-empty OpenAI file_data) becomes a blob with the stripped_reason not_captured, its byte_size under the size rule of the strip: an empty string is 0 bytes, never redacted_upstream. A payload that is itself a data URL follows the data URL rules. An OpenAI file or input_file with no usable file_id, file_data or file_url was dropped upstream (above).'
    - A data URL that is not base64 (`data:<mime>,<payload>`) becomes a blob with the stripped_reason not_captured and no byte_size. Its mime type is the text after `data:` up to the first `;` or `,`, when that is a valid token/token MIME type, else the hint; its payload is everything after the first comma. This rule also covers a URL that names base64 but whose run does not match rule (b), such as `data:image/png;base64,@@`. When its payload is empty or `None`, it becomes a blob with the stripped_reason redacted_upstream.
    - 'When a normalizer rebuilds a native part inside an existing message-key value, it edits in place: only that part object token is replaced by its canonical compact serialization (no spaces, the minimal escaping of the strip), and every other byte of the value stays as it came. A value with nothing to rebuild stays byte for byte. Messages a normalizer builds itself are serialized compactly.'
  in_place_examples:
    - name: only_the_part_is_replaced
      from: 'A spaced message value holding a native blob with content and a MIME type, and no modality.'
      input: '[ {"role": "user", "parts": [ {"type": "blob", "content": "QUJD", "mime_type": "image/png"} ] } ]'
      output: '[ {"role": "user", "parts": [ {"type":"blob","modality":"image","mime_type":"image/png","byte_size":3,"stripped_reason":"not_captured"} ] } ]'
  examples:
    - name: blob_with_a_known_size
      from: 'A base64 data URL of image/png, 8 bytes decoded.'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","byte_size":8,"stripped_reason":"not_captured"}'
    - name: blob_whose_bytes_never_arrived
      from: 'An image item whose content is the placeholder the instrumentor wrote, with no MIME type: the part kind the provider gives it is the modality hint.'
      part: '{"type":"blob","modality":"image","stripped_reason":"redacted_upstream"}'
    - name: data_url_that_is_not_base64
      from: 'The data URL data:text/plain,hello.'
      part: '{"type":"blob","modality":"document","mime_type":"text/plain","stripped_reason":"not_captured"}'
    - name: data_url_that_is_not_base64_and_empty
      from: 'The data URL data:image/png, with no payload.'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","stripped_reason":"redacted_upstream"}'
    - name: blob_with_content_and_no_hint
      from: 'A native blob part with a content member holding the base64 iVBORw0KGgo= and neither a MIME type nor a modality.'
      part: '{"type":"blob","modality":"document","byte_size":8,"stripped_reason":"not_captured"}'
    - name: blob_with_content_labelled_image_for_a_pdf
      from: 'A native blob part with a content member holding the base64 JVBERi0=, the mime_type application/pdf and the modality image, as @ai-sdk/otel writes a PDF: the MIME type wins over the modality it has.'
      part: '{"type":"blob","modality":"document","mime_type":"application/pdf","byte_size":5,"stripped_reason":"not_captured"}'
    - name: blob_with_content_that_is_an_empty_base64_data_url
      from: 'A native blob part with the mime_type image/png and a content member holding data:;base64, which names no mime type and has an empty run: the part''s mime_type is the hint.'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","byte_size":0,"stripped_reason":"not_captured"}'
    - name: blob_with_no_content_and_no_stripped_reason
      from: 'A native blob part with the modality audio and neither content nor stripped_reason.'
      part: '{"type":"blob","modality":"audio","stripped_reason":"redacted_upstream"}'
    - name: blob_with_content_that_is_not_a_string
      from: 'A native blob part whose content is the number 5 and whose byte_size is 8.0, with no stripped_reason.'
      part: '{"type":"blob","modality":"document","byte_size":8,"stripped_reason":"not_captured"}'
    - name: uri_with_no_mime_type_and_no_modality
      from: 'A uri part for https://example.com/download with neither a MIME type nor a modality.'
      part: '{"type":"uri","modality":"document","uri":"https://example.com/download"}'
    - name: uri_with_members_out_of_order_keeps_its_modality
      from: 'A uri part written as uri, modality image, type uri and an extra member, in that order.'
      part: '{"type":"uri","modality":"image","uri":"https://example.com/talk"}'
    - name: uri_with_an_invalid_mime_type
      from: 'A uri part with the mime_type text/plain;charset=x, which is not token/token.'
      part: '{"type":"uri","modality":"document","uri":"https://example.com/notes"}'
    - name: uri_that_is_a_data_url
      from: 'A uri part, or a Gemini file_data, whose URI is data:image/png;base64,iVBORw0KGgo=.'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","byte_size":8,"stripped_reason":"not_captured"}'
    - name: uri_with_a_mime_type
      from: 'An audio part by URL, with the MIME type audio/mpeg.'
      part: '{"type":"uri","modality":"audio","mime_type":"audio/mpeg","uri":"https://example.com/a.mp3"}'
    - name: uri_with_only_an_extension
      from: 'A part by URL, with no MIME type, ending in .mov.'
      part: '{"type":"uri","modality":"video","uri":"https://example.com/clip.mov"}'
    - name: file_with_no_hint
      from: 'A provider file id and nothing else.'
      part: '{"type":"file","modality":"document","file_id":"file-abc123"}'
    - name: uri_with_a_cloud_storage_scheme
      from: 'A part by the URL gs://bucket/a.png with the MIME type image/png: a Vercel file part with that mediaType, a native uri or a Gemini file_data. The link is kept; it is no blob.'
      part: '{"type":"uri","modality":"image","mime_type":"image/png","uri":"gs://bucket/a.png"}'
    - name: uri_tagged_url_with_an_s3_scheme
      from: 'A Vercel file part whose data is v7''s {"type":"url","url":"s3://bucket/report.pdf"}, with no mediaType, or a native uri for that URL: pdf names no modality, so it is a document.'
      part: '{"type":"uri","modality":"document","uri":"s3://bucket/report.pdf"}'
    - name: uri_with_the_file_scheme_and_only_an_extension
      from: 'A Vercel file part, plain or v7 {"type":"url"}, or a native uri, by file:///tmp/clip.mov with no MIME type.'
      part: '{"type":"uri","modality":"video","uri":"file:///tmp/clip.mov"}'
    - name: vercel_file_by_url_with_no_media_type
      from: 'A Vercel file part whose data is https://example.com/a.png, with no mediaType: the URL path''s extension names the modality, as for a native uri.'
      part: '{"type":"uri","modality":"image","uri":"https://example.com/a.png"}'
    - name: blob_from_an_unknown_v7_data_tag
      from: 'A Vercel file part with the mediaType image/png whose data is v7 tagged data of a type no rule names: its size was never measured, so it has no byte_size.'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","stripped_reason":"not_captured"}'
    - name: image_url_that_is_empty
      from: 'An OpenAI image_url item whose url is the empty string.'
      part: '{"type":"blob","modality":"image","stripped_reason":"redacted_upstream"}'
    - name: image_url_that_is_redacted
      from: 'An OpenAI image_url item whose url is __REDACTED__, the marker an instrumentor writes in place of the image.'
      part: '{"type":"blob","modality":"image","stripped_reason":"redacted_upstream"}'
    - name: anthropic_url_source_that_is_empty
      from: 'An Anthropic document whose url source has an empty url.'
      part: '{"type":"blob","modality":"document","stripped_reason":"redacted_upstream"}'
    - name: anthropic_file_source_that_is_empty
      from: 'An Anthropic image whose file source has an empty file_id and the media_type image/png: the MIME type the item gives is kept.'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","stripped_reason":"redacted_upstream"}'
    - name: input_image_with_an_empty_file_id
      from: 'An OpenAI input_image whose file_id is empty, with no image_url.'
      part: '{"type":"blob","modality":"image","stripped_reason":"redacted_upstream"}'
    - name: openai_file_with_an_empty_file_id
      from: 'An OpenAI chat file item whose file is {"file_id":"","filename":"a.png"}: it is no file part without a file_id, but a blob whose modality the filename names.'
      part: '{"type":"blob","modality":"image","stripped_reason":"redacted_upstream"}'
    - name: input_image_with_a_redacted_url_and_a_file_id
      from: 'An OpenAI input_image whose image_url is __REDACTED__ and whose file_id is file-abc123: the usable reference wins.'
      part: '{"type":"file","modality":"image","file_id":"file-abc123"}'
    - name: openai_file_with_no_reference
      from: 'An OpenAI chat file item whose file is {"filename":"a.png"}, with no file_id, file_data or file_url: it is no file part without a file_id, but a blob whose modality the filename names.'
      part: '{"type":"blob","modality":"image","stripped_reason":"redacted_upstream"}'
    - name: openai_file_with_a_file_id_that_is_not_a_string
      from: 'An OpenAI chat file item whose file is {"file_id":5,"filename":"a.wav"}, or an input_file whose file_id is null and whose filename is a.wav: a file_id that is not a string is no reference.'
      part: '{"type":"blob","modality":"audio","stripped_reason":"redacted_upstream"}'
    - name: input_file_with_no_reference_and_no_filename
      from: 'An OpenAI input_file item with no member but its type.'
      part: '{"type":"blob","modality":"document","stripped_reason":"redacted_upstream"}'
    - name: langchain_v1_image_by_url
      from: 'A LangChain v1 block {"type":"image","url":"https://example.com/a.png","mime_type":"image/png"}.'
      block: '{"type":"image","url":"https://example.com/a.png","mime_type":"image/png"}'
      part: '{"type":"uri","modality":"image","mime_type":"image/png","uri":"https://example.com/a.png"}'
    - name: langchain_v1_image_by_url_kind_before_extension
      from: 'A LangChain v1 block {"type":"image","url":"https://example.com/download.bin"}, with no mime_type: the block type names the modality before the URL''s extension is read.'
      block: '{"type":"image","url":"https://example.com/download.bin"}'
      part: '{"type":"uri","modality":"image","uri":"https://example.com/download.bin"}'
    - name: langchain_v1_file_by_url_with_only_an_extension
      from: 'A LangChain v1 block {"type":"file","url":"https://example.com/a.wav"}, with no mime_type: the type file names no modality, so the URL path''s extension does.'
      block: '{"type":"file","url":"https://example.com/a.wav"}'
      part: '{"type":"uri","modality":"audio","uri":"https://example.com/a.wav"}'
    - name: langchain_v1_file_by_url_with_no_extension
      from: 'A LangChain v1 block {"type":"file","url":"s3://bucket/report"}, with no mime_type.'
      block: '{"type":"file","url":"s3://bucket/report"}'
      part: '{"type":"uri","modality":"document","uri":"s3://bucket/report"}'
    - name: langchain_v1_audio_by_data_url
      from: 'A LangChain v1 block {"type":"audio","url":"data:;base64,UklGRg==","mime_type":"audio/wav"}: the data URL names no mime type, so the block''s mime_type is the hint.'
      block: '{"type":"audio","url":"data:;base64,UklGRg==","mime_type":"audio/wav"}'
      part: '{"type":"blob","modality":"audio","mime_type":"audio/wav","byte_size":4,"stripped_reason":"not_captured"}'
    - name: langchain_v1_image_by_redacted_url
      from: 'A LangChain v1 block {"type":"image","url":"__REDACTED__","mime_type":"image/png"}.'
      block: '{"type":"image","url":"__REDACTED__","mime_type":"image/png"}'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","stripped_reason":"redacted_upstream"}'
    - name: langchain_v1_file_by_empty_url
      from: 'A LangChain v1 block {"type":"file","url":""}: no URL is left to give an extension, so it is a document.'
      block: '{"type":"file","url":""}'
      part: '{"type":"blob","modality":"document","stripped_reason":"redacted_upstream"}'
    - name: langchain_v1_image_by_file_id
      from: 'A LangChain v1 block {"type":"image","file_id":"file-abc123"}.'
      block: '{"type":"image","file_id":"file-abc123"}'
      part: '{"type":"file","modality":"image","file_id":"file-abc123"}'
    - name: langchain_v1_video_by_empty_file_id
      from: 'A LangChain v1 block {"type":"video","file_id":"","mime_type":"video/mp4"}.'
      block: '{"type":"video","file_id":"","mime_type":"video/mp4"}'
      part: '{"type":"blob","modality":"video","mime_type":"video/mp4","stripped_reason":"redacted_upstream"}'
    - name: langchain_v1_image_by_redacted_url_and_a_file_id
      from: 'A LangChain v1 block {"type":"image","url":"__REDACTED__","file_id":"file-abc123"}: the usable reference wins.'
      block: '{"type":"image","url":"__REDACTED__","file_id":"file-abc123"}'
      part: '{"type":"file","modality":"image","file_id":"file-abc123"}'
    - name: langchain_v1_file_by_file_id
      from: 'A LangChain v1 block {"type":"file","file_id":"file-abc123","mime_type":"application/pdf"}, read as the native file part it has the shape of.'
      block: '{"type":"file","file_id":"file-abc123","mime_type":"application/pdf"}'
      part: '{"type":"file","modality":"document","mime_type":"application/pdf","file_id":"file-abc123"}'
    - name: langchain_v1_file_by_empty_file_id_is_a_native_file_part
      from: 'A LangChain v1 block {"type":"file","file_id":""}: it has a native file part''s shape, and a native file part keeps its empty file_id.'
      block: '{"type":"file","file_id":""}'
      part: '{"type":"file","modality":"document","file_id":""}'
    - name: langchain_v1_file_by_file_id_keeps_its_modality
      from: 'A LangChain v1 block {"type":"file","file_id":"x","modality":"image"}: read as a native file part, so its valid modality member is kept before anything else is tried.'
      block: '{"type":"file","file_id":"x","modality":"image"}'
      part: '{"type":"file","modality":"image","file_id":"x"}'
    - name: langchain_v1_file_by_empty_file_id_and_a_url
      from: 'A LangChain v1 block {"type":"file","file_id":"","url":"https://example.com/a.pdf"}: the usable url wins over the empty file_id, as a usable reference does everywhere.'
      block: '{"type":"file","file_id":"","url":"https://example.com/a.pdf"}'
      part: '{"type":"uri","modality":"document","uri":"https://example.com/a.pdf"}'
    - name: langchain_v1_file_by_redacted_file_id_and_base64
      from: 'A LangChain v1 block {"type":"file","file_id":"__REDACTED__","base64":"JVBERi0=","mime_type":"application/pdf"}: the base64 wins over the redacted file_id.'
      block: '{"type":"file","file_id":"__REDACTED__","base64":"JVBERi0=","mime_type":"application/pdf"}'
      part: '{"type":"blob","modality":"document","mime_type":"application/pdf","byte_size":5,"stripped_reason":"not_captured"}'
    - name: langchain_v1_file_by_redacted_file_id_and_an_empty_url
      from: 'A LangChain v1 block {"type":"file","file_id":"__REDACTED__","url":""}: no reference in it is usable, so its file_id makes it the native file part it has the shape of, the file_id kept as written.'
      block: '{"type":"file","file_id":"__REDACTED__","url":""}'
      part: '{"type":"file","modality":"document","file_id":"__REDACTED__"}'
    - name: langchain_v1_file_with_a_file_id_that_is_not_a_string_and_a_url
      from: 'A LangChain v1 block {"type":"file","file_id":5,"url":"https://example.com/a.wav"}: it holds a string url, so it is a v1 block, not a native file part left as it came, and its url makes a uri.'
      block: '{"type":"file","file_id":5,"url":"https://example.com/a.wav"}'
      part: '{"type":"uri","modality":"audio","uri":"https://example.com/a.wav"}'
    - name: langchain_v1_text_plain_by_base64
      from: 'A LangChain v1 block {"type":"text-plain","base64":"aGk=","mime_type":"text/plain"}: a text-plain block by base64 is a document blob.'
      block: '{"type":"text-plain","base64":"aGk=","mime_type":"text/plain"}'
      part: '{"type":"blob","modality":"document","mime_type":"text/plain","byte_size":2,"stripped_reason":"not_captured"}'
    - name: langchain_v1_image_by_a_url_led_by_whitespace
      from: 'A LangChain v1 block {"type":"image","url":" data:image/png;base64,iVBO\nRw0KGgo="}: the url holds data: but is no data URL, so it is a blob with no byte_size, and no byte of the data URL is kept.'
      block: '{"type":"image","url":" data:image/png;base64,iVBO\nRw0KGgo="}'
      part: '{"type":"blob","modality":"image","stripped_reason":"not_captured"}'
    - name: langchain_v1_image_by_a_url_led_by_a_tab
      from: 'A LangChain v1 block {"type":"image","url":"\tdata:image/png,%89PNG"}: led by a tab, the percent-encoded data URL is a blob too.'
      block: '{"type":"image","url":"\tdata:image/png,%89PNG"}'
      part: '{"type":"blob","modality":"image","stripped_reason":"not_captured"}'
    - name: langchain_v1_file_by_an_https_url_led_by_a_space
      from: 'A LangChain v1 block {"type":"file","url":" https://example.com/a.pdf"}: a url that holds no data: is a uri, its value kept as it came, the space included.'
      block: '{"type":"file","url":" https://example.com/a.pdf"}'
      part: '{"type":"uri","modality":"document","uri":" https://example.com/a.pdf"}'
    - name: langchain_v1_image_by_a_data_url_with_a_trailing_space
      from: 'A LangChain v1 block {"type":"image","url":"data:image/png;base64,iVBORw0KGgo= "}: it starts with the data scheme, but rule (b)''s pattern does not match all of it, so it is a data URL that is not base64: a blob with no byte_size.'
      block: '{"type":"image","url":"data:image/png;base64,iVBORw0KGgo= "}'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","stripped_reason":"not_captured"}'
    - name: langchain_v1_image_by_a_wrapped_data_url
      from: 'A LangChain v1 block {"type":"image","url":"data:image/png;base64,iVBO\nRw0KGgo="}: a base64 run wrapped at a newline is no whole rule (b) match, so it is a blob with no byte_size.'
      block: '{"type":"image","url":"data:image/png;base64,iVBO\nRw0KGgo="}'
      part: '{"type":"blob","modality":"image","mime_type":"image/png","stripped_reason":"not_captured"}'
    - name: langchain_v1_file_by_a_url_led_by_whitespace_and_an_empty_file_id
      from: 'A LangChain v1 block {"type":"file","file_id":"","url":" data:image/png;base64,iVBORw0KGgo="}: the url is usable and wins over the empty file_id, and since it holds data: it is a blob.'
      block: '{"type":"file","file_id":"","url":" data:image/png;base64,iVBORw0KGgo="}'
      part: '{"type":"blob","modality":"document","stripped_reason":"not_captured"}'
    - name: langchain_v1_file_by_empty_file_id_and_empty_base64
      from: 'A LangChain v1 block {"type":"file","file_id":"","base64":""}: an empty base64 is no usable reference, so it does not beat the empty file_id, and the block is a native file part.'
      block: '{"type":"file","file_id":"","base64":""}'
      part: '{"type":"file","modality":"document","file_id":""}'
    - name: langchain_v1_file_by_empty_file_id_and_redacted_base64
      from: 'A LangChain v1 block {"type":"file","file_id":"","base64":"__REDACTED__"}: a __REDACTED__ base64 is no usable reference either.'
      block: '{"type":"file","file_id":"","base64":"__REDACTED__"}'
      part: '{"type":"file","modality":"document","file_id":""}'
    - name: langchain_v1_image_by_redacted_base64
      from: 'A LangChain v1 block {"type":"image","base64":"__REDACTED__"}: __REDACTED__ is valid base64, and with no file block''s file_id beside it, it is a 9-byte blob as any bare base64 payload is.'
      block: '{"type":"image","base64":"__REDACTED__"}'
      part: '{"type":"blob","modality":"image","byte_size":9,"stripped_reason":"not_captured"}'
    - name: langchain_v1_audio_by_empty_base64
      from: 'A LangChain v1 block {"type":"audio","base64":""}: an empty bare base64 payload is 0 bytes, never redacted_upstream.'
      block: '{"type":"audio","base64":""}'
      part: '{"type":"blob","modality":"audio","byte_size":0,"stripped_reason":"not_captured"}'
    - name: langchain_v1_file_by_a_relative_url
      from: 'A LangChain v1 block {"type":"file","url":"a.png"}: a url with no scheme is a uri as it came, its modality from the extension.'
      block: '{"type":"file","url":"a.png"}'
      part: '{"type":"uri","modality":"image","uri":"a.png"}'
    - name: langchain_v1_image_by_a_rooted_relative_url
      from: 'A LangChain v1 block {"type":"image","url":"/img/a.png"}: a relative url is a uri as it came.'
      block: '{"type":"image","url":"/img/a.png"}'
      part: '{"type":"uri","modality":"image","uri":"/img/a.png"}'
    - name: langchain_v1_image_by_a_link_followed_by_a_data_url
      from: 'A LangChain v1 block {"type":"image","url":"https://example.com/a.png\ndata:image/png;base64,iVBO\nRw0KGgo="}: an https url that holds data: is a blob, so the run past the newline is not kept.'
      block: '{"type":"image","url":"https://example.com/a.png\ndata:image/png;base64,iVBO\nRw0KGgo="}'
      part: '{"type":"blob","modality":"image","stripped_reason":"not_captured"}'
    - name: uri_led_by_whitespace_holding_a_data_url
      from: 'A native uri part {"type":"uri","modality":"image","uri":" data:image/png;base64,iVBO\nRw0KGgo="}: its uri holds data: but is no data URL, so it is a blob with no byte_size, its modality kept.'
      part: '{"type":"blob","modality":"image","stripped_reason":"not_captured"}'
  # A source message, as the source attribute holds it, and the
  # gen_ai.input.messages it becomes.
  message_examples:
    - name: vercel_file_part_with_unreadable_data_makes_no_part
      from: 'Vercel file and image parts whose data is no string (an object with no tag, a number, a v7 text tag whose text is a number) make no part: the message keeps its other parts.'
      source: ai.prompt.messages
      input: '[{"role":"user","content":[{"type":"text","text":"Look:"},{"type":"file","mediaType":"image/png","data":{"0":1}},{"type":"image","image":7},{"type":"file","mediaType":"text/plain","data":{"type":"text","text":7}}]}]'
      output: '[{"role":"user","parts":[{"type":"text","content":"Look:"}]}]'
    - name: openllmetry_langchain_v1_reference_blocks
      from: 'OpenLLMetry writes a message''s content blocks as JSON in gen_ai.prompt.N.content. LangChain v1 blocks by file_id and by url there are file and uri parts, never text parts.'
      source: gen_ai.prompt.0.content
      attributes:
        gen_ai.prompt.0.role: user
      input: '[{"type":"text","text":"Compare these."},{"type":"file","file_id":"file-abc123"},{"type":"image","url":"https://example.com/a.png"},{"type":"audio","file_id":"__REDACTED__"}]'
      output: '[{"role":"user","parts":[{"type":"text","content":"Compare these."},{"type":"file","modality":"document","file_id":"file-abc123"},{"type":"uri","modality":"image","uri":"https://example.com/a.png"},{"type":"blob","modality":"audio","stripped_reason":"redacted_upstream"}]}]'
    - name: laminar_langchain_v1_reference_blocks
      from: 'Laminar writes the same keys on an LLM span (lmnr.span.type LLM), and its blocks are read the same way.'
      source: gen_ai.prompt.0.content
      attributes:
        gen_ai.prompt.0.role: user
        lmnr.span.type: LLM
      input: '[{"type":"text","text":"Read this."},{"type":"file","file_id":"file-abc123","mime_type":"application/pdf"},{"type":"file","url":"https://example.com/a.wav"}]'
      output: '[{"role":"user","parts":[{"type":"text","content":"Read this."},{"type":"file","modality":"document","mime_type":"application/pdf","file_id":"file-abc123"},{"type":"uri","modality":"audio","uri":"https://example.com/a.wav"}]}]'

rows:
  - source: openai.chat
    shape: image_url.url = data:<mime>;base64,...
    direction: input
    normalized: blob
    modality: image
    paths: [passthrough, openinference, laminar]
    fixtures: [openinference-openai/image_data_url, openinference-js-openai/image_data_url]
    note: The mime type comes from the data URL. OpenInference (Python and JS) flattens it into the message contents, and its input.value keeps the request JSON.

  - source: openai.chat
    shape: image_url.url = http(s)://...
    direction: input
    normalized: uri
    modality: image
    paths: [passthrough, openinference, openllmetry, laminar]
    fixtures: [openinference-openai/image_https_url, openinference-js-openai/image_https_url, openllmetry/image_https_url]
    note: OpenLLMetry before 0.62 writes the content array as a JSON string in gen_ai.prompt.N.content. From 0.62 it writes a native uri part. A URL of any other scheme but data (gs://, s3://, file://) is a uri the same way.

  - source: openai.chat
    shape: image_url.url = "" | __REDACTED__
    direction: input
    normalized: blob
    modality: image
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family writes it in a provider item (OpenInference writes __REDACTED__ in its flattened messages; see the OpenInference image row); covered by the SDK pass-through and sink unit tests.
    note: The URL was dropped upstream, so the blob has no byte_size and its stripped_reason is redacted_upstream.

  - source: openai.chat
    shape: input_audio {data, format}
    direction: input
    normalized: blob
    modality: audio
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family writes it in a message key (OpenInference keeps it only in input.value; see the OpenInference raw-payload row); covered by the SDK pass-through unit tests.
    note: The mime type is audio/<format>.

  - source: openai.chat
    shape: file {file_id}
    direction: input
    normalized: [file, blob]
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: The modality comes from the filename extension alone; with no filename it is document. A file with no usable file_id, file_data or file_url (each missing, not a string, empty or __REDACTED__) becomes a blob with stripped_reason redacted_upstream, never a file part without a file_id.

  - source: openai.chat
    shape: file {file_data, filename}
    direction: input
    normalized: blob
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: The modality comes from the data URL's mime type, or from the filename extension.

  - source: openai.chat
    shape: message.audio {data, transcript}
    direction: output
    normalized: blob
    modality: audio
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family writes it in a message key (OpenInference keeps it only in output.value; see the OpenInference raw-payload row); covered by the SDK pass-through unit tests.
    note: A text part with the transcript follows the blob.

  - source: openai.responses
    shape: input_image {image_url | file_id}
    direction: input
    normalized: [blob, uri, file]
    modality: image
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: A data URL becomes a blob, any other URL a uri, a file id a file. An empty or __REDACTED__ image_url or file_id, with no usable other, becomes a blob with stripped_reason redacted_upstream.

  - source: openai.responses
    shape: input_file {file_id | file_data | file_url}
    direction: input
    normalized: [file, blob, uri]
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: A file id becomes a file, file data a blob, a file URL a uri. With no usable file id, file data or file URL (each missing, not a string, empty or __REDACTED__), it becomes a blob with stripped_reason redacted_upstream. The modality comes from a data URL's mime type, else from the filename extension alone (never the file URL's); with no filename it is document.

  - source: openai.responses
    shape: image_generation_call.result (base64)
    direction: output
    normalized: blob
    modality: image
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.

  - source: anthropic.messages
    shape: image / document with source.type = base64
    direction: input
    normalized: blob
    modality: from_mime
    paths: [passthrough, openinference, openllmetry, laminar]
    fixtures: [openinference-anthropic/image_base64, openinference-js-anthropic/image_base64]
    note: The mime type comes from source.media_type. OpenInference Python flattens an image into a data URL in the message contents; OpenInference JS flattens it to image.media_type and image.type with no data at all (a blob with stripped_reason redacted_upstream). A document is dropped from the flattened messages, so it makes no part (see the OpenInference raw-payload row).

  - source: anthropic.messages
    shape: image / document with source.type = url
    direction: input
    normalized: [uri, blob]
    modality: from_mime
    paths: [passthrough, openllmetry, laminar]
    fixtures: []
    reason: No recorded family; covered by the SDK pass-through unit tests.
    note: An empty or __REDACTED__ url becomes a blob with stripped_reason redacted_upstream, keeping source.media_type.

  - source: anthropic.messages
    shape: image / document with source.type = file
    direction: input
    normalized: [file, blob]
    modality: from_mime
